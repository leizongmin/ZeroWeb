[package]
name = "zero-renderer"
description = "ZeroWeb 渲染进程 — 独立进程处理页面渲染和 JS 执行"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zero-renderer"
path = "src/main.rs"

[dependencies]
zero-render-foundation = { workspace = true }
zero-protocol = { workspace = true }
zero-engine = { workspace = true }
zero-page-runtime = { workspace = true }
zero-webview = { workspace = true }
zero-dom = { workspace = true }
zero-css-parser = { workspace = true }
zero-style-system = { workspace = true }
zero-layout-engine = { workspace = true }
zero-net = { workspace = true }
zero-storage = { workspace = true }
zero-script-sandbox = { workspace = true, default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["v8"]
# 镜像 browser 的 feature 传播——下游 v8-gated 代码（webview.rs sandbox 创建、
# engine/page-runtime v8 路径）须随本 bin 的 v8/quickjs 一并开启，否则 `cargo build
# -p zero-renderer` 独立构建时 zero-webview 既无 v8 又无 quickjs → sandbox 未定义。
v8 = [
    "zero-engine/v8",
    "zero-webview/v8",
    "zero-script-sandbox/v8",
    "zero-page-runtime/v8",
]
quickjs = [
    "zero-engine/quickjs",
    "zero-webview/quickjs",
    "zero-script-sandbox/quickjs",
    "zero-page-runtime/quickjs",
]
