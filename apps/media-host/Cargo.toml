[package]
name = "zero-media-host"
description = "ZeroWeb 媒体宿主进程 — 独立进程承载解码与媒体时钟（media-runtime-isolation 方案 C；C1 骨架：握手 + 空源生命周期，解码内核 C2 接入）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zero-media-host"
path = "src/main.rs"

[lib]
name = "zero_media_host"
path = "src/lib.rs"

[dependencies]
zero-protocol = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
