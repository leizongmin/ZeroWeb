<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="zmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7fd4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 256)">
    <!-- 外圈贴边（半径 220，约占画布 86%，接近 Chrome 主体比例） -->
    <circle r="220" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.9"/>

    <!-- 内圈辅助 -->
    <circle r="180" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.35"/>

    <!-- 经纬线（简化，仅保留赤道 + 两条经线，避免噪点） -->
    <g stroke="#2b7fd4" stroke-width="6" fill="none" opacity="0.4">
      <ellipse rx="220" ry="82"/>
      <line x1="0" y1="-220" x2="0" y2="220"/>
    </g>

    <!-- Z 字罗盘指针：放大，撑满内圈，作为核心识别符号 -->
    <path d="M -118 -118 L 118 -118 L -106 106 L 118 106 L 118 138 L -156 138 L -156 110 L 106 -150 L -118 -150 Z"
          fill="url(#zmark)"/>
  </g>
</svg>
