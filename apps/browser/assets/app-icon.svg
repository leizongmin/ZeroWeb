<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="ring"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <!-- 三段环占满整个画布（圆心 256, 半径 256，顶到方框边缘） -->
  <!-- 圆心 (256,256) 半径 256；三段各 120°，从 -90°(正上) 开始 -->
  <g clip-path="url(#ring)">
    <!-- 段1：-90° → 30°（右上，天蓝） -->
    <path d="M 256 0 A 256 256 0 0 1 477.4 384 L 256 256 Z" fill="#4a9eff"/>
    <!-- 段2：30° → 150°（下方，青绿） -->
    <path d="M 477.4 384 A 256 256 0 0 1 34.6 384 L 256 256 Z" fill="#14b8a6"/>
    <!-- 段3：150° → 270°（左上，群青） -->
    <path d="M 34.6 384 A 256 256 0 0 1 256 0 L 256 256 Z" fill="#1e4fd0"/>
  </g>

  <!-- 白色 gap + 中心实心圆 -->
  <circle cx="256" cy="256" r="100" fill="#ffffff"/>
  <circle cx="256" cy="256" r="76" fill="#1858c8"/>
</svg>
