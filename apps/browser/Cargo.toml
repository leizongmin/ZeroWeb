[package]
name = "zero-browser"
description = "ZeroBrowser 浏览器应用入口"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zero-browser"
path = "src/main.rs"

[features]
default = ["windows-console", "v8"]
windows-console = []
v8 = ["zero-engine/v8", "zero-webview/v8", "zero-script-sandbox/v8", "zero-page-runtime/v8", "zero-browser-shell/v8"]
quickjs = ["zero-engine/quickjs", "zero-webview/quickjs", "zero-script-sandbox/quickjs", "zero-page-runtime/quickjs", "zero-browser-shell/quickjs"]

[dependencies]
zero-browser-shell = { workspace = true }
zero-webview = { workspace = true }
zero-page-runtime = { workspace = true }
zero-host-runtime = { workspace = true }
zero-render-foundation = { workspace = true }
zero-engine = { workspace = true }
zero-protocol = { workspace = true }
zero-script-sandbox = { workspace = true, default-features = false }
zero-net = { workspace = true }
zero-security = { workspace = true }
zero-storage = { workspace = true }
winit = { workspace = true }
softbuffer = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tungstenite = { workspace = true }
arboard = { workspace = true }
resvg = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
png = "0.17"
base64 = "0.22"
url = { workspace = true }
ico = "0.5.0"

[dev-dependencies]
serial_test = { workspace = true }

# Windows：注册 SetConsoleCtrlHandler，让 Ctrl+C 走 shutdown_child_processes
# 而不是被默认 handler 直接 TerminateProcess（跳过 Drop，孤儿 renderer 锁住 exe）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

# Windows：构建时把 .ico 嵌入 .exe 资源（Explorer / 任务栏显示应用图标）
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
