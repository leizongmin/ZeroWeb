[package]
name = "zero-browser"
description = "ZeroBrowser 浏览器应用入口"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zero-browser"
path = "src/main.rs"

# 开发构建保留控制台子系统（tracing 日志可见、Ctrl+C 终止）；
# ui-sdk 分支实验阶段：sdk-chrome 默认开启，用 SDK 渲染浏览器 chrome。
[features]
default = ["sdk-chrome"]
windows-console = []
# DC-14 浏览器 SDK chrome 接线：开启后 render_cpu/render_frame 经 `render_chrome_via_sdk` +
# `merge_into_frame` 把 SDK chrome 叠加并入帧。
sdk-chrome = [
    "dep:zero-browser-chrome",
    "dep:zero-text-foundation",
    "dep:zero-ui-adapter-render-foundation",
    "dep:zero-ui-core",
    "dep:zero-ui-widgets",
]

[dependencies]
zero-browser-shell = { workspace = true }
zero-webview = { workspace = true }
zero-page-runtime = { workspace = true }
zero-host-runtime = { workspace = true }
zero-render-foundation = { workspace = true }
zero-engine = { workspace = true }
zero-protocol = { workspace = true }
zero-script-sandbox = { workspace = true }
zero-net = { workspace = true }
zero-security = { workspace = true }
zero-storage = { workspace = true }
# DC-14 SDK chrome 接线（feature `sdk-chrome`，默认关闭）。
zero-browser-chrome = { workspace = true, optional = true }
zero-text-foundation = { workspace = true, optional = true }
zero-ui-adapter-render-foundation = { workspace = true, optional = true }
zero-ui-core = { workspace = true, optional = true }
zero-ui-widgets = { workspace = true, optional = true }
winit = { workspace = true }
softbuffer = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tungstenite = { workspace = true }
arboard = { workspace = true }
resvg = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
png = "0.17"
url = { workspace = true }
ico = "0.5.0"

[dev-dependencies]
serial_test = { workspace = true }

# Windows：注册 SetConsoleCtrlHandler，让 Ctrl+C 走 shutdown_child_processes
# 而不是被默认 handler 直接 TerminateProcess（跳过 Drop，孤儿 renderer 锁住 exe）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

# Windows：构建时把 .ico 嵌入 .exe 资源（Explorer / 任务栏显示应用图标）
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
