[package]
name = "zero-image-decoder"
description = "ZeroWeb 图像解码进程 — 独立进程解码 PNG/JPEG/WebP，隔离编解码器漏洞"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zero-image-decoder"
path = "src/main.rs"

[lib]
name = "zero_image_decoder"
path = "src/lib.rs"

[dependencies]
zero-render-foundation = { workspace = true }
zero-protocol = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
png = "0.17"
