[package]
name = "zero-browser-chrome"
description = "浏览器专属 chrome 组件 — 由通用 ui/widgets+patterns 组合；可与 zero-browser-shell + ui/adapters/webview 耦合（唯一允许的浏览器耦合点）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zero-ui-core = { workspace = true }
zero-ui-widgets = { workspace = true }
zero-ui-render = { workspace = true }
zero-ui-runtime = { workspace = true }
# §8.4.1A 组件组合通用 patterns（TabBar/SuggestionList/StatusBubble/SearchField）。
zero-ui-patterns = { workspace = true }
zero-ui-adapter-webview = { workspace = true }
# DC-14 render_chrome_via_sdk：SDK chrome 渲染管线桥接（chrome→bridge 允许耦合，DC-1）。
zero-ui-adapter-render-foundation = { workspace = true }
zero-text-foundation = { workspace = true }
zero-browser-shell = { workspace = true }
compact_str = { workspace = true, features = ["serde"] }

[dev-dependencies]
# sdk_render 测试断言 RenderPrimitives（render-foundation 类型）。
zero-render-foundation = { workspace = true }
