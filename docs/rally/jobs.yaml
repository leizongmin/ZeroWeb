# Rally cron 定时任务配置（docs/rally/jobs.yaml）
#
# 所有定时任务统一使用 claude-dsflash（deepseek-v4-flash）agent-command——
# 便宜时段（晚 8 点 ~ 早 6 点）运行，控制成本。
# 启动调度器：rally cron run -w .
# 校验配置：  rally cron run -w . --dry-run
#
# 执行前先同步：每个任务开始执行前，必须先 git pull --rebase 拉取远端 main 最新代码，
# 确认基线为最新后再开始执行——避免基于旧代码跑一大轮后得出过时的结论。
#
# 任务清单：
#   1. docs-maintenance     每天凌晨 4:17 维护 README 等文档到最新
#   2. monthly-report-finalize 每月 2 日凌晨 3:17 补充月报「决策与亮点」
#   3. goal-blockers-nightly 每晚 22:17 整理待决策卡点，处理一部分 + 飞书征询
defaults:
  cwd: "$DIR/../.."          # docs/rally/../.. = 仓库根
  concurrency: "skip"        # 同 job 重叠时跳过
  start: "next"
  # 外层超时（cron runner 杀整个 rally query 进程）。每个 job 必须显式覆盖此值；
  # 内层 docs/rally/config.yaml 的 ralph.agent_timeout 须 >= 此处最大值，见其注释。
  timeout_seconds: 7200
  env:
    RALLY_ENV: "cron"

jobs:
  # 每日维护 learning 资产：重建索引（自动）+ 评估 skill 方法论变更（只出草案）。
  # 操作手册：docs/rally/learning-maintenance.md（prompt 保持薄，规则改文档不改这里）。
  - id: "learning-maintenance"
    enabled: true
    schedule: "33 5 * * *"
    command: "rally"
    args:
      - "query"
      - "维护 ZeroWeb learning 资产：完整阅读并严格按 docs/rally/learning-maintenance.md 执行每日维护流程（校验新增 learning 格式、make learnings-index 重建索引、按该文档第 3 步规则评估并维护 .agents/skills/zeroweb-guidelines/SKILL.md——已获常设授权可直接修改，无需草案审批；无新增 learning 时输出 DONE）。提交前按文档第 4 步执行 git diff --check 与 lei-pre-commit-guard。"
      - "-w"
      - "."
      - "--agent-command"
      - "claude-dsflash"
    # 轻量文档维护：历史 max 12m，7200s 裕量充足。
    timeout_seconds: 7200
    query:
      session_reuse: false

  # 每周在 Weekly Build / 趋势任务完成后维护官网进展；首次运行会建立最小静态更新区，
  # 后续仅追加可追溯的中英双语周报，并提交到 main 触发 GitHub Pages 发布。
  - id: "website-progress-weekly"
    enabled: true
    schedule: "30 10 * * 0"
    command: "rally"
    args:
      - "query"
      - "维护 ZeroWeb 官网的最新进展。先 git pull --rebase 同步 main；以本周新增提交、ROADMAP.md、docs/goal/*/master.md、docs/monthly/、WPT 与性能趋势为唯一事实来源。首次运行时，建立最小的网站更新区：首页显示最新 3 条、独立更新归档页，并使用可版本控制的数据文件承载内容；之后每周只追加一条中英双语周报。每条必须包含日期、摘要、已完成项、进行中项、来源链接；没有可验证事实时不要编造，改为输出 DONE。不得改 Rust 源码、Cargo 配置、路线图 Mission/Done Criteria 或 GitHub Actions；不要修改既有更新的事实内容。新增周报的中英文文案在定稿后、提交前，必须调用 /lei-humanizer skill 做人性化处理（去除 AI 写作痕迹，如公式化句式、三段式列举、宣传腔、金句），处理时不得改动事实、数字与来源链接。完成后按 docs/rally/run-rules.md 执行适用检查、lei-pre-commit-guard，提交并推送 main，触发 GitHub Pages 发布。"
      - "-w"
      - "."
      - "--agent-command"
      - "claude-dsflash"
    cwd: "$DIR/../.."
    concurrency: "skip"
    start: "next"
    # 首次建站 + 周报撰写（含 humanizer）；历史 6.9m，首次运行可能显著更长。
    timeout_seconds: 7200
    query:
      session_reuse: true
      max_session_uses: 7

  # 每天早上维护 README 与仓库顶层/关键文档到最新仓库事实
  # 维护清单：README.md、ROADMAP.md、CHANGELOG.md、AGENTS.md、CLAUDE.md、
  # CONTRIBUTING.md、SECURITY.md、CODE_OF_CONDUCT.md、docs/architecture.md、
  # docs/dependency-upgrade-backlog.md、docs/goal/*/master.md 控制面（含
  # zero-web/master.md 体积治理：R3xxx 记录 >10 条时归档到 archive/）、
  # docs/rally/run-rules.md、docs/specs/ 规格文档，
  # 以及各 crate 的 README（crates/ apps/ tests/ tools/ 下含 Cargo.toml 的目录：
  # 缺失的补写、过时的更新）
  - id: "docs-maintenance"
    enabled: true
    schedule: "17 4 * * *"
    command: "rally"
    args:
      - "query"
      - "维护仓库文档到最新状态：核对以下文档与当前仓库事实的一致性——README.md（功能/测试数/用法）、ROADMAP.md（路线图里程碑状态与近期推进是否一致）、CHANGELOG.md（最近提交的可发布变更）、AGENTS.md / CLAUDE.md（编码准则与仓库现状）、CONTRIBUTING.md / SECURITY.md / CODE_OF_CONDUCT.md（如内容过时）、docs/architecture.md、docs/dependency-upgrade-backlog.md（依赖升级积压项状态）、docs/goal/*/master.md（各 goal 控制面）、docs/rally/run-rules.md、docs/specs/ 规格文档；**维护各 crate 的 README**：扫描 crates/、apps/、tests/、tools/ 下所有含 Cargo.toml 的目录——无 README.md 的按既有风格补写（`# ZeroWeb <Name> (`zero-xxx`)` 标题 + 一句话摘要 + 概述 + 主要功能 + 使用示例），已有 README.md 的核对与当前仓库事实（Cargo.toml description、src 模块结构、公共 API、CLI 子命令、测试数）的一致性并更新过时内容；git log 近期新增的 crate 优先核对；仅依据仓库事实编写，不得编造功能，README 中引用的相对路径须先验证存在；更新过时内容（不重写长期目标文档 docs/goal/zero-web.md / docs/goal/rendering-compat.md 的 Mission/Done Criteria）；**特别维护 docs/goal/zero-web/master.md 体积**：若「最近完成的改进」中带轮次标记（R 后接数字）的记录超过 10 条，把更早的记录（从第 11 条起、到首个「### -N.」或「### 0.」编号叙事节之前）**原样迁移**到 docs/goal/zero-web/archive/r3xxx-history.md（追加在该文件 `---` 分隔线后，保留原有倒序），master.md 仅保留最近 10 条 + 归档指针，目标保持 master.md 单文件 < 2500 行；迁移前后用 grep 核对记录数守恒（删多少 = 加多少）；遵循 docs/rally/run-rules.md 的提交规则（fmt/clippy/测试门禁、lei-pre-commit-guard）并推送到 main；无变更则直接输出 DONE。"
      - "-w"
      - "."
      - "--agent-command"
      - "claude-dsflash"
    cwd: "$DIR/../.."
    concurrency: "skip"
    start: "next"
    # 重 job：扫描全部文档 + 各 crate README 核对，历史 p50 5m / max 12m；上限给足。
    timeout_seconds: 7200
    query:
      session_reuse: true
      max_session_uses: 7

  # 月初在月报 CI 生成基础版后，补充「决策与亮点」章节
  - id: "monthly-report-finalize"
    enabled: true
    schedule: "17 3 2 * *"
    command: "rally"
    args:
      - "query"
      - "补充更新上月月度工程报告：检查 docs/monthly/ 上月（上月 = 上个月份，如本月为 2026-08 则看 2026-07.md）报告——CI 已生成基础版（WPT 趋势/性能趋势/提交统计）；从 git 历史与 docs/goal/*/master.md 的最近完成项提取本月亮点与决策（用户拍板事项、架构决策、关键技术修复、里程碑达成），补充到「决策与亮点」章节（保留已有内容，追加新条目）；遵循 docs/rally/run-rules.md 提交规则推送到 main；无变更则直接输出 DONE。"
      - "-w"
      - "."
      - "--agent-command"
      - "claude-dsflash"
    cwd: "$DIR/../.."
    concurrency: "skip"
    start: "next"
    # 月报补充章节：读 git 历史 + goal master 提取亮点；轻量。
    timeout_seconds: 7200
    query:
      session_reuse: false

  # 每晚 21:00 与凌晨 3:00：手动触发 main CI，失败则修复并提交（claude-dsflash）
  - id: "ci-watchdog"
    enabled: true
    schedule: "0 21,3 * * *"
    command: "rally"
    args:
      - "query"
      - "守护 main 分支 CI：① 用 gh workflow run ci.yml 手动触发 main 的 CI（gh 已登录；--ref main）；② 轮询 gh run view <run_id> 直到完成（build-and-test / benchmarks / smoke）；③ 若有失败 job，分析失败原因——修复能自主修复的（编译错误、测试失败、脚本问题），遵循 docs/rally/run-rules.md 提交规则（cargo fmt/clippy、make test、lei-pre-commit-guard）提交并推送到 main，然后重新触发 CI 确认；④ 已知预存失败（与本次变更无关的既有 CI 问题）记录到 master.md 不强行修复；⑤ 全部通过或确认无自主可修项后输出 DONE。"
      - "-w"
      - "."
      - "--agent-command"
      - "claude-dsflash"
    cwd: "$DIR/../.."
    concurrency: "skip"
    start: "next"
    # 重 job：触发 CI + 轮询（一轮 40-60m）+ 失败修复（本地门禁）+ 复触发，可能两轮 CI。
    # 历史自然完成最长 116m，多次在 2h 被内层超时掐死时仍在正常工作。
    timeout_seconds: 14400
    query:
      session_reuse: false

  # 每晚整理推进 goal 时的待决策卡点：自主处理能处理的，其余发飞书征询
  - id: "goal-blockers-nightly"
    enabled: true
    schedule: "17 22 * * *"
    command: "rally"
    args:
      - "query"
      - "整理最近推进 goal 时遇到的待决策卡点：扫描 docs/goal/*/master.md 的「待用户决策」清单与最近推进记录（git log 最近 3 天）。两类处理：(1) 能自主处理的（文档纠偏、轻量修复、证据补全、配置修正）直接处理并按 docs/rally/run-rules.md 规则提交推送到 main；(2) 确实需要用户拍板的（深结构方向、改 Mission/Done 范围、许可证问题、破坏性操作、大额下载），汇总成清单（事项+为何需用户+建议），用飞书 CLI 发消息征询用户意见（命令见 docs/rally/run-rules.md 第 7 条：lark-cli im +messages-send，消息需说明具体事项与建议）；处理后更新 master.md 待决策清单状态。输出 DONE 或 CONTINUE。"
      - "-w"
      - "."
      - "--agent-command"
      - "claude-dsflash"
    cwd: "$DIR/../.."
    concurrency: "skip"
    start: "next"
    # 历史 p50 18m，但含「自主处理 + 提交推送」分支，可能触发完整质量门禁。
    timeout_seconds: 7200
    query:
      session_reuse: true
      max_session_uses: 7

  # 每天 06:00 对新 main SHA 做低频防劣化巡检；无新提交时由 Skill 的本地 SHA 标记快速退出。
  # 发现可复现回归后先飞书告警，再最小修复、验证、提交并普通推送 main，最后飞书汇报。
  - id: "zeroweb-regression-guard"
    enabled: true
    schedule: "0 6 * * *"
    command: "rally"
    args:
      - "query"
      - "使用 $zeroweb-regression-guard Skill 巡检当前 main。严格复用 make bench-gate 和 docs/perf/baselines 检查 CPU、页面耗时与整体 RSS，并收集 renderer/compositor 分进程内存、断连、product-smoke 与 Chrome production parity 证据；无新 SHA 时立即 DONE。发现可复现劣化后先按 docs/rally/run-rules.md 发飞书告警：局部问题尝试最小修复并完成质量门禁、lei-pre-commit-guard、rebase、提交和普通推送 main；工程量大、两次尝试失败或需要架构/基线决策时，停止改代码，把证据与专项方案记入对应 goal master，只提交并推送该文档，飞书通知等待人工确认。不得放宽阈值、覆盖较差基线、强推或触碰既有未提交改动。"
      - "-w"
      - "."
      - "--agent-command"
      - "claude-dsflash"
    cwd: "$DIR/../.."
    concurrency: "skip"
    start: "next"
    # 重 job：bench-gate + 分进程内存 + product-smoke 证据收集 + 可能的最小修复。
    # 历史 70-81m 自然完成，一次在 2h 被内层超时掐死。
    timeout_seconds: 14400
    query:
      session_reuse: false
