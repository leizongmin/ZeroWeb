<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<!-- R657 fixture 008: <font> tag — absolute size 1..7, relative +/-, color, face.
     Exercises presentational font sizing + color + font-family (R502 hints + UA font). -->
<html><head><meta charset="utf-8"><title>Legacy font tag — Fixture 008</title></head>
<body bgcolor="#FFFFFF" text="#000000">
<p>Normal body text baseline.</p>
<p><font size="1">size 1 tiny</font>
<font size="2">size 2</font>
<font size="3">size 3 default</font>
<font size="4">size 4</font>
<font size="5">size 5</font>
<font size="6">size 6</font>
<font size="7">size 7 huge</font></p>
<p>Base text <font size="+2">relative +2</font> and <font size="-1">relative -1</font> here.</p>
<p><font color="#CC0000">red text</font> <font face="monospace">monospace face</font>
<font face="serif" color="#0000CC" size="5">serif blue size5</font></p>
</body></html>
