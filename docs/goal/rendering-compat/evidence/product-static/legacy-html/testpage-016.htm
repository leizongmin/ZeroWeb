<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<!-- R657 fixture 016: CSS1 box model — margin collapse between siblings,
     padding, and border styles (solid/dashed/dotted/double/groove). -->
<html><head><meta charset="utf-8"><title>Legacy box model — Fixture 016</title>
<style>
.s1 { background: #E0E0FF; margin: 20px; padding: 8px; }
.s2 { background: #FFE0E0; margin: 20px; padding: 8px; }
.b-solid { border: 2px solid #333; margin: 8px 0; padding: 6px; }
.b-dashed { border: 2px dashed #333; margin: 8px 0; padding: 6px; }
.b-dotted { border: 2px dotted #333; margin: 8px 0; padding: 6px; }
.b-double { border: 4px double #333; margin: 8px 0; padding: 6px; }
</style>
</head>
<body>
<div class="s1">Box one: margin 20 + padding 8. Adjacent vertical margins should collapse with box two.</div>
<div class="s2">Box two: margin 20 + padding 8. Margin between box one and two collapses (max, not sum).</div>
<div class="b-solid">solid border 2px</div>
<div class="b-dashed">dashed border 2px</div>
<div class="b-dotted">dotted border 2px</div>
<div class="b-double">double border 4px</div>
</body></html>
