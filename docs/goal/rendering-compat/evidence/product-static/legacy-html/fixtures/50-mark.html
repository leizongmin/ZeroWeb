<h3>Highlight element</h3>
<p>Normal text with <mark>highlighted mark element</mark> in the middle of a sentence.</p>
<p>Multiple <mark>marks</mark> can appear <mark>inline</mark> together.</p>
<p>An author-overridden mark: <mark style="background-color:#90ee90">light green mark</mark> must keep its inline style (UA overridable).</p>
<p>Final paragraph — no overlap.</p>
