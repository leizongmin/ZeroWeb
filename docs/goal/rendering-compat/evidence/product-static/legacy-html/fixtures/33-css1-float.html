<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html><head><title>css1 float</title></head>
<body>
<div style="float:left;width:120px;height:80px;background:#aaccff">float left</div>
<p>This paragraph should wrap around the floated div on the right side, flowing beside it and then continuing below once past the float's height boundary.</p>
<div style="float:right;width:100px;height:60px;background:#ffaacc;clear:right;margin-top:10px">float right</div>
<p>Another paragraph wrapping around a right-floated element.</p>
<div style="clear:both"></div>
<p>Paragraph after clearing both floats.</p>
</body></html>
