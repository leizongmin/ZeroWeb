<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html><head><title>caption thead tbody tfoot</title></head>
<body>
<table border="1" cellpadding="6" width="80%">
<caption>Monthly Sales Report</caption>
<colgroup><col width="40%"><col width="30%"><col width="30%"></colgroup>
<thead><tr bgcolor="#cccccc"><th>Month</th><th>Revenue</th><th>Units</th></tr></thead>
<tfoot><tr bgcolor="#eeeeee"><td>Total</td><td>$1,000</td><td>50</td></tr></tfoot>
<tbody>
<tr><td>Jan</td><td>$400</td><td>20</td></tr>
<tr><td>Feb</td><td>$600</td><td>30</td></tr>
</tbody>
</table>
</body></html>
