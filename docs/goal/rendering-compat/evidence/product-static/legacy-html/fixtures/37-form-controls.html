<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html><head><title>form controls</title></head>
<body bgcolor="#ffffff">
<form action="#">
  <fieldset>
    <legend>User details</legend>
    <p>
      <label>Name: <input type="text" name="name" value="Alice"></label>
      <label>Password: <input type="password" name="pw" value="secret"></label>
    </p>
    <p>
      <label><input type="checkbox" name="sub" checked> Subscribe</label>
      <label><input type="radio" name="plan" value="a" checked> Plan A</label>
      <label><input type="radio" name="plan" value="b"> Plan B</label>
    </p>
    <p>
      Country:
      <select name="country">
        <option value="us">United States</option>
        <option value="cn" selected>China</option>
        <option value="jp">Japan</option>
      </select>
    </p>
    <p>
      Notes:<br>
      <textarea name="notes" rows="3" cols="30">Default note text spanning a couple of words.</textarea>
    </p>
    <p>
      <input type="submit" value="Send">
      <input type="reset" value="Clear">
      <button type="button">A button</button>
    </p>
  </fieldset>
</form>
</body></html>
