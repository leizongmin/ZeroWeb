<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<!-- R657 fixture 018: CSS2 anchor pseudo-classes + text-decoration +
     text-transform. Exercises link coloring + case transforms. -->
<html><head><meta charset="utf-8"><title>Legacy anchor/text — Fixture 018</title>
<style>
a:link { color: #0000EE; }
a:visited { color: #551A8B; }
a:hover { color: #FF0000; text-decoration: none; }
.upper { text-transform: uppercase; }
.lower { text-transform: lowercase; }
.cap { text-transform: capitalize; }
</style>
</head>
<body>
<p>Links: <a href="#a">unvisited link</a> and <a href="#b">another link</a>.</p>
<p>Normal: hello World FOO bar</p>
<p class="upper">uppercase: hello World FOO bar</p>
<p class="lower">lowercase: hello World FOO bar</p>
<p class="cap">capitalize: hello World FOO bar</p>
</body></html>
