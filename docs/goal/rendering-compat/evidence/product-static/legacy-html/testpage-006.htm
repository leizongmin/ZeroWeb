<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<!-- R657 fixture 006: nested unordered/ordered lists — UA list indentation +
     list-style-type defaults (disc/circle/square by depth, decimal by ol depth). -->
<html><head><meta charset="utf-8"><title>Legacy nested lists — Fixture 006</title></head>
<body bgcolor="#FFFFFF" text="#111111">
<h3>Nested lists</h3>
<ul>
  <li>Top level disc item
    <ul>
      <li>Second level circle item
        <ul>
          <li>Third level square item</li>
          <li>Another third level</li>
        </ul>
      </li>
      <li>Back to second level</li>
    </ul>
  </li>
  <li>Another top level
    <ol>
      <li>Nested ordered one</li>
      <li>Nested ordered two</li>
    </ol>
  </li>
  <li>Last top level</li>
</ul>
</body></html>
