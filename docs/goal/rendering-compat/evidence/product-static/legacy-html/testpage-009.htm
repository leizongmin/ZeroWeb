<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<!-- R657 fixture 009: table colspan/rowspan + thead/tbody/tfoot sections.
     Exercises table grid construction with cell spanning (R177 family). -->
<html><head><meta charset="utf-8"><title>Legacy span table — Fixture 009</title></head>
<body bgcolor="#FFFFFF" text="#000000">
<table border="1" cellpadding="5" cellspacing="0">
  <thead>
    <tr bgcolor="#CCCCCC">
      <th>Name</th><th>Col 1</th><th>Col 2</th><th>Col 3</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td rowspan="2">Spans two rows</td>
      <td>a1</td><td>b1</td><td>c1</td>
    </tr>
    <tr>
      <td>a2</td><td>b2</td><td>c2</td>
    </tr>
    <tr>
      <td colspan="2">Spans two cols</td><td>single</td><td>single</td>
    </tr>
    <tr>
      <td colspan="4">Full-width spanning row</td>
    </tr>
  </tbody>
  <tfoot>
    <tr bgcolor="#EEEEEE">
      <td colspan="4">Footer row spanning all columns</td>
    </tr>
  </tfoot>
</table>
</body></html>
