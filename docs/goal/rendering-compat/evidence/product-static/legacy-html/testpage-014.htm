<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<!-- R657 fixture 014: CSS1/2 background-color, text-indent, text-decoration,
     font shorthand, list-style-type. Internal <style> exercising CSS1 features. -->
<html><head><meta charset="utf-8"><title>Legacy CSS1 features — Fixture 014</title>
<style>
body { background-color: #FAFAF0; color: #222; }
h2 { background-color: #224466; color: #FFFFFF; text-indent: 0; padding: 4px; }
.indent { text-indent: 30px; }
.strike { text-decoration: line-through; }
.under { text-decoration: underline; }
ol.dec { list-style-type: decimal; }
ol.roman { list-style-type: upper-roman; }
.shorthand { font: italic bold 14px/1.5 monospace; }
</style>
</head>
<body>
<h2>CSS1 background header</h2>
<p class="indent">This paragraph has a first-line indent of 30px applied via CSS.</p>
<p>This word is <span class="strike">struck</span> and this one is
<span class="under">underlined</span>.</p>
<ol class="dec">
  <li>decimal one</li><li>decimal two</li>
</ol>
<ol class="roman">
  <li>roman one</li><li>roman two</li>
</ol>
<p class="shorthand">Font shorthand: italic bold 14px monospace line-height 1.5.</p>
</body></html>
