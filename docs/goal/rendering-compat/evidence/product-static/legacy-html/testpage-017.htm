<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<!-- R657 fixture 017: table-layout:fixed + colgroup/col widths + caption.
     Exercises fixed table column sizing (R177 / table.rs width paths). -->
<html><head><meta charset="utf-8"><title>Legacy fixed table — Fixture 017</title>
<style>
table.t { table-layout: fixed; width: 100%; border-collapse: collapse; }
table.t th, table.t td { border: 1px solid #888; padding: 4px; }
</style>
</head>
<body>
<table class="t">
  <caption>Table caption above the fixed-layout table</caption>
  <colgroup>
    <col style="width:50%">
    <col style="width:30%">
    <col style="width:20%">
  </colgroup>
  <thead>
    <tr><th>Wide (50%)</th><th>Medium (30%)</th><th>Narrow (20%)</th></tr>
  </thead>
  <tbody>
    <tr><td>cell A1 long content</td><td>cell B1</td><td>C1</td></tr>
    <tr><td>cell A2 even longer content that should not change column widths in fixed layout</td><td>B2</td><td>C2</td></tr>
  </tbody>
</table>
</body></html>
