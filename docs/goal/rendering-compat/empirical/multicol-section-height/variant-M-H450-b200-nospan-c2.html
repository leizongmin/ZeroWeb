<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>empirical multicol M: H=450 single block 200, no span, col-count=2 (base case)</title>
<style>
  article { column-count: 2; width: 400px; column-gap: 0; background-color: white; }
  div.container { height: 450px; background-color: magenta; }
  div.block { width: 100px; background-color: red; height: 200px; }
  body { margin: 0; }
</style>
</head>
<body>
<article>
  <div class="container">
    <div class="block">1</div>
  </div>
</article>
</body>
</html>
