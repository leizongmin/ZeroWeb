     `make testharness-editing-other-one FILTER=zz-probe` 执行。
     M1 基线实测：F1/F2/F6 Pass，F3/F4/F5 Fail——innerHTML 产物的宿主侧身份失步。
     M2 首轮修复后（2026-10-30）F1-F6 全 Pass；配套 G 系列
     （zz-probe-m2.html：runConformanceTest 形态 opening query / matches /
     documentElement.cloneNode(true) pending 携带 / setupDiv marker walk）全 Pass。
     修复四笔：① matches 自含语义（R188 includeSelf——part03）；② doc 级
     querySelector 解析产物 in-doc 判定（_zwPendingPlainInDoc 父链上行，
     R145/R3902b 门——part05/part06）；③ cloneNode 深克隆源读走 R380 融合
     （_zwFusedInnerHtmlSel 抽取共享——part04/part05）；④ 子树脏门 ID 锚定
     sel 感知（_zwPendingSubtreeDirty 补 __zw_contains 祖先判定 + 记账代际
     缓存——part05，`#wrap`/`#tc` 浅选择器无字面前缀关系）。 -->
<meta charset=utf-8>
<div id=log></div>
<div id=test-container></div>
<script src=/resources/testharness.js></script>
<script src=/resources/testharnessreport.js></script>
<script>
"use strict";
test(function() {
  var d = document.getElementById("test-container");
  d.innerHTML = "<div contenteditable id=dyn-f></div>";
  assert_not_equals(document.querySelector("#dyn-f"), null, "host id_map sees dyn-f");
}, "F1: host tree has dyn-f (id query)");
test(function() {
  var dyn = document.getElementById("dyn-f");
  assert_equals(dyn.id, "dyn-f", "JS id reflected");
  assert_true(dyn.hasAttribute("id"), "JS hasAttribute id");
  assert_true(dyn.hasAttribute("contenteditable"), "JS hasAttribute contenteditable");
}, "F2: JS API sees both attrs");
test(function() {
  var dyn = document.getElementById("dyn-f");
  assert_true(dyn.matches("div"), "host matches tag-only on dyn-f");
}, "F3: host matches tag on dyn-f");
test(function() {
  var dyn = document.getElementById("dyn-f");
  assert_true(dyn.matches("[id=dyn-f]"), "host matches [id=dyn-f]");
}, "F4: host matches id attr on dyn-f");
test(function() {
  var dyn = document.getElementById("dyn-f");
  assert_true(dyn.matches("[contenteditable]"), "host matches contenteditable presence");
}, "F5: host matches contenteditable on dyn-f");
test(function() {
  var n2 = document.createElement("div");
  n2.setAttribute("contenteditable", "true");
  document.getElementById("test-container").appendChild(n2);
  assert_true(n2.matches("[contenteditable=true]"), "setAttribute path host matches");
}, "F6: setAttribute element host matches");
</script>
