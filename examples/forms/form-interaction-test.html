<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ZeroWeb 表单交互测试</title>
  <style>
    body { max-width: 680px; margin: 40px auto; font: 16px sans-serif; line-height: 1.5; }
    fieldset { margin: 18px 0; padding: 16px; border: 1px solid #767676; }
    label { display: block; margin: 10px 0; }
    input, textarea, button { font: inherit; padding: 6px; }
    #name, textarea, button { appearance: none; border: 1px solid #767676; border-radius: 0; outline: none; }
    #name { display: block; width: 216px; height: 40px; box-sizing: border-box; }
    textarea { display: block; width: 100%; height: 80px; box-sizing: border-box; }
    input[type="checkbox"], input[type="radio"] { accent-color: #005cc8; }
    button {
      height: 40px; margin-right: 8px; box-sizing: border-box; white-space: nowrap;
      background: #efefef;
    }
    #click { width: 74px; }
    #reset, #submit { width: 54px; }
    #result { display: block; min-height: 1.5em; margin-top: 16px; color: #075985; }
  </style>
</head>
<body>
  <h1>表单交互测试</h1>
  <p>依次测试：点击输入框并输入文字、退格、按 Tab 切换焦点，再点击各按钮。</p>

  <form id="form">
    <fieldset>
      <legend>文本控件</legend>
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" placeholder="点击后输入文字">
      <label for="note">备注</label>
      <textarea id="note" name="note" placeholder="可输入多行文本"></textarea>
    </fieldset>

    <fieldset>
      <legend>选择控件</legend>
      <label><input id="subscribe" name="subscribe" type="checkbox"> 订阅更新</label>
      <label><input id="plan-basic" name="plan" type="radio" value="basic" checked> 基础版</label>
      <label><input id="plan-pro" name="plan" type="radio" value="pro"> 专业版</label>
    </fieldset>

    <button id="click" type="button">普通点击按钮</button><button id="reset" type="reset">重置表单</button><button id="submit" type="submit">提交表单</button>
  </form>

  <output id="result" aria-live="polite">等待交互</output>
  <output id="test-state" hidden>{}</output>

  <script>
    const result = document.getElementById('result');
    const form = document.getElementById('form');
    const name = document.getElementById('name');
    const note = document.getElementById('note');
    const subscribe = document.getElementById('subscribe');
    const planBasic = document.getElementById('plan-basic');
    const planPro = document.getElementById('plan-pro');
    const testState = document.getElementById('test-state');
    const eventLog = [];
    const observedEvents = ['mousedown', 'focus', 'mouseup', 'click', 'input', 'change', 'reset', 'submit'];
    observedEvents.forEach(type => {
      // https://w3c.github.io/uievents/#event-flow
      document.addEventListener(type, event => {
        eventLog.push({
          event,
          type: event.type,
          target: event.target.id ? `#${event.target.id}` : event.target.tagName.toLowerCase()
        });
      }, true);
    });
    let focused = '';
    const syncTestState = reason => {
      const serialized = JSON.stringify({
        reason,
        name: name.value,
        note: note.value,
        subscribe: subscribe.checked,
        plan: planBasic.checked ? 'basic' : planPro.checked ? 'pro' : '',
        focused,
        result: result.textContent,
        events: eventLog.map(entry => ({
          type: entry.type,
          target: entry.target,
          defaultPrevented: entry.event.defaultPrevented
        }))
      });
      testState.textContent = serialized;
      if (location.search.includes('__zero_test_state=1')) {
        document.title = `ZERO_TEST_STATE:${serialized}`;
      }
    };
    ['name', 'note', 'subscribe', 'plan-basic', 'plan-pro', 'click', 'reset', 'submit'].forEach(id => {
      document.getElementById(id).addEventListener('focus', event => {
        focused = event.target.id;
        syncTestState('focus');
      });
    });
    document.getElementById('click').addEventListener('click', () => {
      result.textContent = '普通按钮 click 事件已触发。';
      syncTestState('button');
    });
    name.addEventListener('input', event => {
      result.textContent = `输入事件：${event.target.value}`;
      syncTestState('name-input');
    });
    note.addEventListener('input', event => {
      result.textContent = `备注输入：${event.target.value}`;
      syncTestState('note-input');
    });
    subscribe.addEventListener('change', event => {
      result.textContent = `复选框：${event.target.checked ? '已选中' : '未选中'}`;
      syncTestState('subscribe-change');
    });
    [planBasic, planPro].forEach(radio => {
      radio.addEventListener('change', event => {
        result.textContent = `套餐：${event.target.value}`;
        syncTestState('plan-change');
      });
    });
    form.addEventListener('reset', () => {
      result.textContent = '表单已重置。';
      queueMicrotask(() => {
        syncTestState('reset');
      });
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      result.textContent = '提交事件已触发（已阻止导航）。';
      syncTestState('submit');
    });
    syncTestState('initial');
  </script>
</body>
</html>
