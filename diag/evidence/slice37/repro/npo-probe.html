<!doctype html>

<head><meta charset="utf-8"><title>slice37 NPO probe</title></head>
<body>
<h3>slice37 NPO probe</h3>
<div id="probe-el-npid1"></div>
<pre id="out">running...</pre>
<iframe name="pnamed" id="pnamed-iframe" src="npo-probe-support.html"></iframe>
<script>
var R = {};
function T(k, v) { R[k] = String(v); }
function tryT(k, fn) { try { T(k, fn()); } catch (e) { T(k, 'THREW:' + (e && e.name)); } }
function tag(o) { try { return Object.prototype.toString.call(o); } catch (e) { return 'ERR'; } }
function protoOf(o) { try { return Object.getPrototypeOf(o); } catch (e) { return null; } }
function hasOwn(o, p) { try { return Object.prototype.hasOwnProperty.call(o, p); } catch (e) { return 'ERR'; } }
function pd(o, p) { try { return Object.getOwnPropertyDescriptor(o, p); } catch (e) { return undefined; } }
function descStr(d) {
  if (!d) return 'undefined';
  var v = ('value' in d) ? (typeof d.value === 'object' && d.value !== null ? 'obj' : String(d.value)) : 'acc';
  return 'v=' + v + ',w=' + d.writable + ',e=' + d.enumerable + ',c=' + d.configurable;
}
function mark(x, el) { return x === el ? 'element' : (typeof x === 'object' && x !== null ? 'obj' : String(x)); }
var strictDelete = new Function("obj", "prop", "'use strict';\nreturn delete obj[prop];");
var hasIframe = (typeof HTMLIFrameElement !== 'undefined') || true;

// ---- make named elements ----
function mkEl(id) { var e = document.createElement('span'); e.id = id; document.body.appendChild(e); return e; }
var elDesc = mkEl('npid1');   // descriptor face
var elSw   = mkEl('npsw');    // expando shadow face
var elD1   = mkEl('npdl1');   // window-level sloppy delete
var elD2   = mkEl('npdl2');   // window-level strict delete
var elD3   = mkEl('npdl3');   // npo-level sloppy delete
var elD4   = mkEl('npdl4');   // npo-level strict delete

// ---- S0 basics ----
tryT('s0.winEqGlobalThis', function () { return window === globalThis; });
tryT('s0.winTag', function () { return tag(window); });
tryT('s0.defaultViewEqWin', function () { return document.defaultView === window; });

// ---- S1 prototype chain shape ----
tryT('s1.typeofWindow', function () { return typeof Window; });
tryT('s1.typeofEventTarget', function () { return typeof EventTarget; });
tryT('s1.protoOfWindowTag', function () { return tag(protoOf(window)); });
var chain = [];
tryT('s1.chain', function () {
  for (var o = window, n = 0; o && n < 8; o = protoOf(o), n++) chain.push(tag(o));
  return chain.join(' -> ');
});
tryT('s1.protoWinProtoIsEventTargetProto', function () {
  return protoOf(Window.prototype) === EventTarget.prototype;
});
tryT('s1.etProtoTag', function () { return tag(EventTarget.prototype); });
tryT('s1.gspTag', function () { return tag(protoOf(protoOf(window))); });
tryT('s1.etProtoCtorOwn', function () {
  var d = pd(EventTarget.prototype, 'constructor');
  return d ? ('w=' + d.writable + ',e=' + d.enumerable + ',c=' + d.configurable + ',valIsET=' + (d.value === EventTarget)) : 'undefined';
});

// ---- S2 named property descriptor face (NPO level) ----
tryT('s2.gspHasNpid1', function () { var g = protoOf(protoOf(window)); return ('npid1' in g); });
tryT('s2.gspOwnNpid1', function () { return hasOwn(protoOf(protoOf(window)), 'npid1'); });
tryT('s2.gspDescNpid1', function () { return descStr(pd(protoOf(protoOf(window)), 'npid1')); });
tryT('s2.gspValNpid1', function () { return mark(protoOf(protoOf(window)).npid1, elDesc); });
tryT('s2.winValNpid1', function () { return mark(window.npid1, elDesc); });
tryT('s2.winOwnNpid1', function () { return hasOwn(window, 'npid1'); });
tryT('s2.forInNpid1', function () {
  var found = false;
  for (var k in window) { if (k === 'npid1') { found = true; break; } }
  return found;
});

// ---- S3 expando shadowing (Chrome arbitration point) ----
tryT('s3.setup', function () { window.npsw = 'SHADOW'; return 'ok'; });
tryT('s3.winVal', function () { return mark(window.npsw, elSw); });
tryT('s3.winOwn', function () { return hasOwn(window, 'npsw'); });
tryT('s3.winDesc', function () { return descStr(pd(window, 'npsw')); });
tryT('s3.winProtoVal', function () { return mark(Window.prototype.npsw, elSw); });
tryT('s3.winProtoDesc', function () { return descStr(pd(Window.prototype, 'npsw')); });
tryT('s3.npoVal', function () { return mark(protoOf(Window.prototype).npsw, elSw); });
tryT('s3.npoDesc', function () { return descStr(pd(protoOf(Window.prototype), 'npsw')); });
tryT('s3.etProtoVal', function () { return mark(EventTarget.prototype.npsw, elSw); });

// ---- S4 delete semantics ----
tryT('s4.winSloppy', function () {
  var r = delete window.npdl1;
  return 'ret=' + r + ',reread=' + mark(window.npdl1, elD1) + ',own=' + hasOwn(window, 'npdl1');
});
tryT('s4.winStrict', function () {
  var out;
  try { out = 'ret=' + strictDelete(window, 'npdl2'); } catch (e) { out = 'THREW:' + (e && e.name); }
  return out + ',reread=' + mark(window.npdl2, elD2);
});
tryT('s4.npoSloppy', function () {
  var g = protoOf(protoOf(window));
  var r = delete g.npdl3;
  return 'ret=' + r + ',reread=' + mark(g.npdl3, elD3) + ',winreread=' + mark(window.npdl3, elD3);
});
tryT('s4.npoStrict', function () {
  var g = protoOf(protoOf(window));
  var out;
  try { out = 'ret=' + strictDelete(g, 'npdl4'); } catch (e) { out = 'THREW:' + (e && e.name); }
  return out + ',reread=' + mark(g.npdl4, elD4);
});

// ---- S5 global [[Prototype]] mutability (feasibility for shim design) ----
tryT('s5.setProtoGlobal', function () {
  var save = protoOf(globalThis);
  var r = Object.setPrototypeOf(globalThis, Object.prototype);
  var now = protoOf(globalThis) === Object.prototype;
  Object.setPrototypeOf(globalThis, save);
  return 'retObj=' + (r === globalThis) + ',changed=' + now + ',restored=' + (protoOf(globalThis) === save);
});

// ---- S6 constructor face ----
tryT('s6.winCtorIsFunc', function () { return typeof window.constructor; });
tryT('s6.winCtorOwn', function () { return hasOwn(window, 'constructor'); });
tryT('s6.winProtoCtorDesc', function () { return descStr(pd(protoOf(window), 'constructor')); });
tryT('s6.gspCtorIn', function () { return ('constructor' in protoOf(protoOf(window))); });
tryT('s6.gspCtorOwn', function () { return hasOwn(protoOf(protoOf(window)), 'constructor'); });
tryT('s6.gspCtorDesc', function () { return descStr(pd(protoOf(protoOf(window)), 'constructor')); });

// ---- S7 cross-global (iframe) ----
var gspNow = null;
tryT('s7.pending', function () { return 'yes'; });

function render() {
  var keys = Object.keys(R);
  var lines = [];
  for (var i = 0; i < keys.length; i++) lines.push(keys[i] + ' = ' + R[keys[i]]);
  var out = document.getElementById('out');
  if (out) out.textContent = lines.join('\n');
  window.__probeResult = JSON.stringify(R);
}
function crossGlobal() {
  delete R['s7.pending'];
  tryT('s7.iframeTag', function () {
    var f = document.getElementsByTagName('iframe')[0];
    var w = f && f.contentWindow;
    return w ? tag(w) : ('null:' + String(w));
  });
  tryT('s7.winEqContent', function () {
    var f = document.getElementsByTagName('iframe')[0];
    return f && f.contentWindow === window.pnamed;
  });
  tryT('s7.contentChain', function () {
    var f = document.getElementsByTagName('iframe')[0];
    var w = f && f.contentWindow;
    if (!w) return 'no-cw';
    var parts = [];
    for (var o = w, n = 0; o && n < 8; o = protoOf(o), n++) parts.push(tag(o));
    return parts.join(' -> ');
  });
  tryT('s7.contentNamed', function () {
    var f = document.getElementsByTagName('iframe')[0];
    var w = f && f.contentWindow;
    if (!w || !w.document) return 'no-cw-doc';
    return mark(w.named, w.document.getElementById('named'));
  });
  tryT('s7.contentNamedAtGsp', function () {
    var f = document.getElementsByTagName('iframe')[0];
    var w = f && f.contentWindow;
    if (!w) return 'no-cw';
    var g = protoOf(protoOf(w));
    var d = pd(g, 'named');
    return 'own=' + hasOwn(g, 'named') + ',desc=' + descStr(d);
  });
  render();
}
var ifr = document.getElementsByTagName('iframe')[0];
ifr.onload = crossGlobal;
setTimeout(function () {
  if (R['s7.pending']) { R['s7.pending'] = 'IFRAME-NO-LOAD'; render(); }
}, 4000);

// sync sections render immediately
render();
</script>
</body>
