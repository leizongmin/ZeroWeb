<!doctype html>
<html>
<head><meta charset="utf-8"><title>slice36 named access dynamic repro</title></head>
<body>
<div id="out">PENDING</div>
<script>
// 最小复现：脚本在安装后创建元素并赋 id → 按规范访问时应解析。
// https://html.spec.whatwg.org/multipage/window-object.html#named-access-on-the-window-object
(function () {
  var d = document.createElement('div');
  d.id = 'dyn36';
  document.body.appendChild(d);
  var viaAccess = window.dyn36;
  var resolved = (viaAccess === d);
  var text = 'dyn36 resolved: ' + resolved;
  // 属性变异面：append 后赋 name（img 白名单四类）。
  var im = document.createElement('img');
  im.setAttribute('name', 'nm36');
  document.body.appendChild(im);
  text += ' | nm36: ' + (window.nm36 === im ? 'resolved' : 'undefined');
  // 移除注销面。
  document.body.removeChild(im);
  text += ' | after-remove nm36: ' + (window.nm36 === undefined ? 'unregistered' : 'stale');
  document.getElementById('out').textContent = text;
  window.__repro = { resolved: resolved, identity: viaAccess === d };
})();
</script>
</body>
</html>
