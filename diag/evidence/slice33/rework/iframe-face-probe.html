<!doctype html>
<html>
<head><meta charset="utf-8"><title>slice33 rework iframe-face probe</title></head>
<body style="font:18px monospace; background:#ffffff; color:#111; margin:16px">
<h3>Window named access - iframe face (slice33 B-1 rework)</h3>
<form name="s28form"><input value="in-form"></form>
<img name="s28img" id="s28imgid" alt="img-with-name">
<iframe name="fr"></iframe>
<input name="s28q" value="input-not-nameable">
<script>
function line(label, v) {
  var t = (v !== null && typeof v === 'object') ? '[object ' + (v.tagName || 'Object') + ']' : String(v);
  return '<div>' + label + ' = ' + t + '</div>';
}
var html = '';
html += line('script-time window.fr', window.fr);
html += line('script-time window.s28form', window.s28form);
html += line('script-time window.s28img', window.s28img);
html += line('script-time String(window.s28q)', window.s28q);
document.body.insertAdjacentHTML('beforeend', html);
window.addEventListener('load', function () {
  var fr = window.fr;
  var el = document.querySelector('iframe');
  var html2 = '<hr><div>--- after load (R139 materialized) ---</div>';
  html2 += line('load-time window.fr', fr);
  html2 += line('window.fr === iframe element', fr === el);
  html2 += line('window.fr === iframe.contentWindow', fr === el.contentWindow);
  document.body.insertAdjacentHTML('beforeend', html2);
});
</script>
</body>
</html>
