[workspace]
resolver = "2"
members = [
    # 核心引擎层
    "crates/dom",
    "crates/css-parser",
    "crates/style-system",
    "crates/layout-engine",
    "crates/engine",
    "crates/canvas",

    # 基础设施层
    "crates/render-foundation",
    "crates/host-runtime",
    "crates/net",
    "crates/security",
    "crates/storage",
    "crates/protocol",
    "crates/product-version",

    # 脚本与沙箱
    "crates/script-sandbox",
    "crates/wasm-sandbox",

    # 页面运行时（共享）
    "crates/page-runtime",

    # API 层
    "crates/webview",
    "crates/browser-shell",

    # 应用入口
    "apps/browser",
    "apps/renderer",
    "apps/image-decoder",
    "apps/compositor",
    "apps/webdriver",
    "apps/webview-demo",

    # 测试基础设施
    "tests/wpt-runner",
    "tests/integration",

    # 开发工具（不随发布产物分发）
    "tools/icon-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插入序保留 map（Web Storage key(n) 插入序 / 序列化键序）
indexmap = "2"

# 错误处理
thiserror = "2"
anyhow = "1"
dirs = "6"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 图形与渲染
wgpu = "24"
fontdue = "0.9"
swash = "0.2"
softbuffer = "0.4"
resvg = "0.47"

# 文字排版
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-segmentation = "=1.12.0"

# 窗口与平台
winit = "0.30"
arboard = "3"

# 网络
hyper = "1"
reqwest = "0.12"
# 字符编码（CSS Syntax §6.2 charset determination：@charset / BOM / Content-Type）
encoding_rs = "0.8"

# HTML 解析
html5ever = "0.29"

# 布局
taffy = "0.12"

# JavaScript 引擎
v8 = { version = "150.2.0", default-features = false }

# WASM 运行时
wasmtime = { version = "36", default-features = false }
wasmi = "0.40"

# 基准测试
criterion = "0.5"

# 测试工具
serial_test = "3"

# 工具
bytemuck = "1"
hashbrown = "0.17"
compact_str = "0.9"
slotmap = "1"
url = "2"
parking_lot = "0.12"
pollster = "0.4"

# WebSocket（无头浏览器协议）
tungstenite = "0.29"

# 哈希（crypto.subtle.digest：SHA-1/256/384/512，RustCrypto；digest 0.10 已为 transitive dep）
sha1 = "0.10"
sha2 = "0.10"

# 对称加密（crypto.subtle AES-GCM：AES-128/192/256-GCM，RustCrypto；R2957）
aes-gcm = "0.10"

# CSPRNG（crypto.getRandomValues/randomUUID OS 随机源，R2960）
getrandom = "0.3"

# PNG 编码（canvas.toDataURL：pixel_buffer → PNG）
png = "0.18"

# 内部 crate 依赖
zero-dom = { path = "crates/dom" }
zero-css-parser = { path = "crates/css-parser" }
zero-style-system = { path = "crates/style-system" }
zero-layout-engine = { path = "crates/layout-engine" }
zero-engine = { path = "crates/engine", default-features = false }
zero-canvas = { path = "crates/canvas" }
zero-render-foundation = { path = "crates/render-foundation" }
zero-host-runtime = { path = "crates/host-runtime" }
zero-net = { path = "crates/net" }
zero-security = { path = "crates/security" }
zero-storage = { path = "crates/storage" }
zero-protocol = { path = "crates/protocol" }
zero-product-version = { path = "crates/product-version" }
zero-script-sandbox = { path = "crates/script-sandbox", default-features = false }
zero-wasm-sandbox = { path = "crates/wasm-sandbox" }
zero-page-runtime = { path = "crates/page-runtime", default-features = false }
zero-webview = { path = "crates/webview", default-features = false }
zero-browser-shell = { path = "crates/browser-shell", default-features = false }

# 本地 taffy 补丁：添加 cached_baselines() 访问器以提取 flex 容器基线
[patch.crates-io]
taffy = { path = "crates/taffy-local" }
