[workspace]
resolver = "2"
members = [
    # 核心引擎层
    "crates/dom",
    "crates/css-parser",
    "crates/style-system",
    "crates/layout-engine",
    "crates/engine",
    "crates/canvas",

    # 基础设施层
    "crates/render-foundation",
    "crates/host-runtime",
    "crates/net",
    "crates/security",
    "crates/storage",
    "crates/protocol",

    # 脚本与沙箱
    "crates/script-sandbox",
    "crates/wasm-sandbox",

    # 页面运行时（共享）
    "crates/page-runtime",

    # API 层
    "crates/webview",
    "crates/browser-shell",

    # 应用入口
    "apps/browser",
    "apps/renderer",
    "apps/webview-demo",

    # UI SDK 通用层（浏览器无关；不得依赖 zero-browser-shell/webview/engine/net）
    "ui/core",
    "ui/render",
    "ui/i18n",
    "ui/runtime",
    "ui/widgets",
    "ui/patterns",
    "ui/animation",
    "ui/gestures",
    "ui/navigation",
    "ui/overlay",
    "ui/collections",
    "ui/commands",
    "ui/forms",
    "ui/assets",
    "ui/platform",
    "ui/restoration",
    "ui/testing",
    "ui/devtools",
    "ui/design-system",
    "ui/dsl",
    "ui/adapters/winit",
    "ui/adapters/webview",
    "ui/adapters/render-foundation",
    "ui/adapters/harmonyos",
    "ui/adapters/android",
    "ui/examples",

    # 浏览器专属 chrome 组件（唯一允许依赖 zero-browser-shell + ui/adapters/webview 的耦合点）
    "browser-ui/chrome",

    # 共享文本/字体基础层（UI SDK 与 WebView 共用）
    "foundation/text",

    # 测试基础设施
    "tests/wpt-runner",
    "tests/integration",

    # 开发工具（不随发布产物分发）
    "tools/icon-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"
anyhow = "1"
dirs = "6"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 图形与渲染
wgpu = "24"
fontdue = "0.9"
swash = "0.2"
softbuffer = "0.4"
resvg = "0.47"

# 文字排版
rustybuzz = "0.20"
unicode-bidi = "0.3"

# 窗口与平台
winit = "0.30"
arboard = "3"

# 网络
hyper = "1"
reqwest = "0.12"

# HTML 解析
html5ever = "0.29"

# 布局
taffy = "0.7"

# JavaScript 引擎
rusty_v8 = { version = "0.32", default-features = false }

# WASM 运行时
wasmtime = { version = "36", default-features = false }
wasmi = "0.40"

# 基准测试
criterion = "0.5"

# 测试工具
serial_test = "3"

# 工具
bytemuck = "1"
hashbrown = "0.17"
compact_str = "0.9"
slotmap = "1"
url = "2"
parking_lot = "0.12"
pollster = "0.4"

# WebSocket（无头浏览器协议）
tungstenite = "0.29"

# 内部 crate 依赖
zero-dom = { path = "crates/dom" }
zero-css-parser = { path = "crates/css-parser" }
zero-style-system = { path = "crates/style-system" }
zero-layout-engine = { path = "crates/layout-engine" }
zero-engine = { path = "crates/engine" }
zero-canvas = { path = "crates/canvas" }
zero-render-foundation = { path = "crates/render-foundation" }
zero-host-runtime = { path = "crates/host-runtime" }
zero-net = { path = "crates/net" }
zero-security = { path = "crates/security" }
zero-storage = { path = "crates/storage" }
zero-protocol = { path = "crates/protocol" }
zero-script-sandbox = { path = "crates/script-sandbox" }
zero-wasm-sandbox = { path = "crates/wasm-sandbox" }
zero-page-runtime = { path = "crates/page-runtime" }
zero-webview = { path = "crates/webview" }
zero-browser-shell = { path = "crates/browser-shell" }

# UI SDK 内部 crate（浏览器无关，通用层）
zero-ui-core = { path = "ui/core" }
zero-ui-render = { path = "ui/render" }
zero-ui-i18n = { path = "ui/i18n" }
zero-ui-runtime = { path = "ui/runtime" }
zero-ui-examples = { path = "ui/examples" }
zero-ui-widgets = { path = "ui/widgets" }
zero-ui-patterns = { path = "ui/patterns" }
zero-ui-animation = { path = "ui/animation" }
zero-ui-gestures = { path = "ui/gestures" }
zero-ui-navigation = { path = "ui/navigation" }
zero-ui-overlay = { path = "ui/overlay" }
zero-ui-collections = { path = "ui/collections" }
zero-ui-commands = { path = "ui/commands" }
zero-ui-forms = { path = "ui/forms" }
zero-ui-assets = { path = "ui/assets" }
zero-ui-platform = { path = "ui/platform" }
zero-ui-restoration = { path = "ui/restoration" }
zero-ui-testing = { path = "ui/testing" }
zero-ui-devtools = { path = "ui/devtools" }
zero-ui-design-system = { path = "ui/design-system" }
zero-ui-dsl = { path = "ui/dsl" }
zero-ui-adapter-winit = { path = "ui/adapters/winit" }
zero-ui-adapter-webview = { path = "ui/adapters/webview" }
zero-ui-adapter-render-foundation = { path = "ui/adapters/render-foundation" }
zero-ui-adapter-harmonyos = { path = "ui/adapters/harmonyos" }
zero-ui-adapter-android = { path = "ui/adapters/android" }
zero-text-foundation = { path = "foundation/text" }

# 浏览器专属 chrome（允许依赖 zero-browser-shell + ui/adapters/webview）
zero-browser-chrome = { path = "browser-ui/chrome" }

# 本地 taffy 补丁：添加 cached_baselines() 访问器以提取 flex 容器基线
[patch.crates-io]
taffy = { path = "crates/taffy-local" }
