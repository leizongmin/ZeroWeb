[package]
name = "zero-integration-tests"
description = "跨 crate 集成测试"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zero-dom = { workspace = true }
zero-css-parser = { workspace = true }
zero-style-system = { workspace = true }
zero-layout-engine = { workspace = true }
zero-engine = { workspace = true }
zero-page-runtime = { workspace = true }
zero-net = { workspace = true }
zero-security = { workspace = true }
zero-storage = { workspace = true }
zero-protocol = { workspace = true }
zero-canvas = { workspace = true }
zero-wasm-sandbox = { workspace = true }
zero-webview = { workspace = true }
zero-render-foundation = { workspace = true }
zero-script-sandbox = { workspace = true, default-features = false }
zero-browser-shell = { workspace = true }
zero-browser = { path = "../../apps/browser", default-features = false, features = ["test-support"] }
zero-renderer = { path = "../../apps/renderer", default-features = false }
serde_json = { workspace = true }

[features]
default = ["v8"]
v8 = ["zero-engine/v8", "zero-webview/v8", "zero-script-sandbox/v8", "zero-page-runtime/v8", "zero-browser-shell/v8", "zero-browser/v8", "zero-renderer/v8"]
quickjs = ["zero-engine/quickjs", "zero-webview/quickjs", "zero-script-sandbox/quickjs", "zero-page-runtime/quickjs", "zero-browser-shell/quickjs", "zero-browser/quickjs", "zero-renderer/quickjs"]

[dev-dependencies]
wat = "1"
serial_test = { workspace = true }
