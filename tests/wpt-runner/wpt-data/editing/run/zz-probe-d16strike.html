<!doctype html>
<meta charset=utf-8>
<title>zz-probe-d16strike</title>
<!-- DC-2 d16 批（2026-11-14 常驻）：strike 方向规则 + u/s css-true 裸 span 吸收
     1) :670（css-true）`foo<s>ba[r</s>]baz` + strike =
        `foo<s>ba</s>rbaz`——REMOVE 方向按选区起点位置判（尾边界前移
        规范化后命中 <s>，qS before=false 不决定方向）；孤立跑绿案，
        守方向门 + REMOVE 管线。S2e :640 行（b]az 尾段入选形）序列上下文
        语料绿由 face 每批守——孤立跑该行 end 侧 splitText 重绑后双 b
        （冷路径位移槽脱钩家族，face 序列行为为语料权威，见 d16 证据）。
     2) M1 css-true（:33）`<p>[foo</p><p> <span>bar</span> </p><p>baz]</p>`
        + strike（styleWithCSS true）= decl 并到中段既有裸 span，非嵌套
        外裹；空白文本不裹。underline.js:33 同构（吸收臂双命令面）。
        断言前做 style attr 归一（CSSOM 序列化 `p: v` 空格形 vs 语料 `p:v`）。
     运行：make testharness-editing-run-one FILTER=zz-probe-d16strike -->
<link rel=stylesheet href=../include/reset.css>
<div id=log></div>
<div id=test-container></div>
<script src=/resources/testharness.js></script>
<script src=/resources/testharnessreport.js></script>
<script>
"use strict";
function nextnode(node) {
  if (node.firstChild) return node.firstChild;
  while (node) {
    if (node.nextSibling) return node.nextSibling;
    node = node.parentNode;
  }
}
function mywalk(node, html) {
  node.innerHTML = html;
  var sn = null, so = 0, en = null, eo = 0;
  var cur = node;
  while (true) {
    if (!cur || (cur != node && !(cur.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_CONTAINS))) break;
    if (cur.nodeType != 3) { cur = nextnode(cur); continue; }
    var dA = cur.data.replace(/\]/g, "");
    var iA = dA.indexOf("[");
    var dB = cur.data.replace(/\[/g, "");
    var iB = dB.indexOf("]");
    cur.data = cur.data.replace(/[\[\]]/g, "");
    if (iA != -1) { sn = cur; so = iA; }
    if (iB != -1) { en = cur; eo = iB; }
    if (!cur.data.length) {
      if (cur == sn || cur == en) throw "bracket in empty text";
      var old = cur;
      cur = nextnode(cur);
      old.parentNode.removeChild(old);
    } else {
      cur = nextnode(cur);
    }
  }
  return [sn, so, en, eo];
}
function strikeCase(input, setup, expected, label) {
  test(function() {
    var tc = document.getElementById("test-container");
    tc.innerHTML = "<div contenteditable></div><p>test";
    var host = document.querySelector("div[contenteditable]");
    var pts = mywalk(host, input);
    var r = document.createRange();
    r.setStart(pts[0], pts[1]); r.setEnd(pts[2], pts[3]);
    if (r.collapsed) r.setEnd(pts[0], pts[1]);
    getSelection().removeAllRanges(); getSelection().addRange(r);
    for (var i = 0; i < setup.length; i++) {
      document.execCommand(setup[i][0], false, setup[i][1]);
    }
    var got = host.innerHTML.replace(
      /style="([^"]*)"/g,
      function (mS, bodyS) {
        return 'style="' + bodyS.replace(/:\s+/g, ":").replace(/;\s+/g, ";") + '"';
      });
    assert_equals(got, expected, "got=");
  }, label);
}
strikeCase("foo<s>ba[r</s>]baz",
  [["stylewithcss", "true"], ["strikethrough", ""]],
  "foo<s>ba</s>rbaz", "D16 :670 css-true tail-boundary REMOVE (corpus row)");
strikeCase("<p>[foo</p><p> <span>bar</span> </p><p>baz]</p>",
  [["stylewithcss", "true"], ["strikethrough", ""]],
  "<p><span style=\"text-decoration:line-through\">foo</span></p>"
  + "<p> <span style=\"text-decoration:line-through\">bar</span> </p>"
  + "<p><span style=\"text-decoration:line-through\">baz</span></p>",
  "D16 M1 :33 css-true bare span absorb");
</script>
</body>
</html>
