<!DOCTYPE html>
<meta charset="utf-8">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<div id="test-container"></div>
<script>
"use strict";
var tc = document.getElementById('test-container');
tc.innerHTML = "<div contenteditable></div>";
var host = document.querySelector("div[contenteditable]");

// 语料标记语义（editor.js setup 直译）：[] 于文本节点 → 文本内 offset；
// {} 于文本节点 → 元素层边界（父节点 childIndex + 前导内容修正）。
function setupCorp(html) {
  host.innerHTML = html;
  var startNode = null, startOffset = 0, endNode = null, endOffset = 0;
  (function walk(n) {
    if (n.nodeType !== 3) { for (var c = n.firstChild; c; c = c.nextSibling) walk(c); return; }
    var data = n.data;
    var si = data.search(/[\[{]/);
    var ei = data.search(/[\]}]/);
    if (si !== -1) {
      var mch = data.charAt(si);
      if (mch === '[') {
        startNode = n;
        startOffset = data.slice(0, si).replace(/[\[\]{}]/g, "").length;
      } else {
        startNode = n.parentNode;
        startOffset = Array.prototype.indexOf.call(n.parentNode.childNodes, n)
          + (si > 0 ? 1 : 0);
      }
    }
    if (ei !== -1) {
      var mce = data.charAt(ei);
      if (mce === ']') {
        endNode = n;
        endOffset = data.slice(0, ei).replace(/[\[\]{}]/g, "").length;
      } else {
        endNode = n.parentNode;
        endOffset = Array.prototype.indexOf.call(n.parentNode.childNodes, n)
          + (ei > 0 ? 1 : 0);
      }
    }
    var clean = data.replace(/[\[\]{}]/g, "");
    if (clean !== data) n.data = clean;
  })(host);
  var r = document.createRange();
  r.setStart(startNode, startOffset); r.setEnd(endNode, endOffset);
  getSelection().removeAllRanges(); getSelection().addRange(r);
}

function d8probe(tag, input, seq, want, asserts) {
  test(function() {
    setupCorp(input);
    for (var i = 0; i < seq.length; i++) {
      document.execCommand(seq[i][0], false, seq[i][1]);
    }
    assert_equals(host.innerHTML, want.replace(/[\[\]{}]/g, ""), tag + ' GOT=');
    if (asserts) {
      for (var j = 0; j < asserts.length; j++) {
        var a = asserts[j];
        var got;
        if (a[0] === 'qS') got = document.queryCommandState(a[1]);
        else if (a[0] === 'qV') got = document.queryCommandValue(a[1]);
        else got = document.queryCommandIndeterm(a[1]);
        assert_equals(got, a[2], tag + ' ' + a[0] + '(' + a[1] + ') GOT=');
      }
    }
  }, tag);
}
// —— I2 tag face 内嵌 normal span（:2021-2032 族）——
d8probe("C1 cite full css-false", 'foo{<cite>bar</cite>}baz',
  [["stylewithcss","false"],["italic",""]],
  'foo<cite><span style="font-style:normal">bar</span></cite>baz');
d8probe("C2 var full css-true", 'foo{<var>bar</var>}baz',
  [["stylewithcss","true"],["italic",""]],
  'foo<var><span style="font-style:normal">bar</span></var>baz');
// —— I1 css-true 切分幸存 i span 化——
d8probe("I1a head partial css-true", 'foo[<i>b]ar</i>baz',
  [["stylewithcss","true"],["italic",""]],
  'foob<span style="font-style:italic">ar</span>baz');
d8probe("I1b tail partial css-true", 'foo<i>ba[r</i>]baz',
  [["stylewithcss","true"],["italic",""]],
  'foo<span style="font-style:italic">ba</span>rbaz');
d8probe("I1c mid partial css-true", 'foo<i>b[a]r</i>baz',
  [["stylewithcss","true"],["italic",""]],
  'foo<span style="font-style:italic">b</span>a<span style="font-style:italic">r</span>baz');
// —— I3 css-false decl ≡italic → i / oblique 邻接——
d8probe("I3a italic decl head css-false", '<span style=font-style:italic>fo[o</span><span style=font-style:oblique>b]ar</span>',
  [["stylewithcss","false"],["italic",""]],
  '<i>fo</i>ob<span style="font-style:oblique">ar</span>');
d8probe("I3b oblique head css-false", '<span style=font-style:oblique>fo[o</span><span style=font-style:italic>b]ar</span>',
  [["stylewithcss","false"],["italic",""]],
  '<span style="font-style:oblique">fo</span>ob<i>ar</i>');
d8probe("I3c oblique shell in-range css-true", 'fo[o<span style=font-style:oblique>b]ar</span>baz',
  [["stylewithcss","true"],["italic",""]],
  'fo<span style="font-style:italic">o</span><span style="font-style:oblique"><span style="font-style:italic">b</span>ar</span>baz');
// —— I6 跨 face 载体 css-true head——
d8probe("I6 address css-true", '<i>fo[o</i><address>b]ar</address>',
  [["stylewithcss","true"],["italic",""]],
  '<span style="font-style:italic">fo</span>o<address><span style="font-style:normal">b</span>ar</address>');
// —— C3 cite 部分选区绿哨兵（语料 :263-266 录形，mid-partial 内裹既有面）——
d8probe("C3 cite mid partial css-false", 'foo<cite>b[a]r</cite>baz',
  [["stylewithcss","false"],["italic",""]],
  'foo<cite>b<span style="font-style:normal">[a]</span>r</cite>baz');
// —— I5 collapsed qS off-face 守卫（语料 :53-57 dict：innerHTML 不变 +
// qS after=false——d9 批 collapsed 臂接通后落账，与 d9diag C2 同守卫面）——
d8probe("I5 collapsed qS off", '<i>foo[]bar</i>',
  [["stylewithcss","false"],["italic",""]],
  '<i>foo[]bar</i>', [["qS","italic",false]]);
</script>
</body>
