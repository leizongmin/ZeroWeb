# wptfyi-coverage 手调分片清单（ci_discover_shards.py 的输入）。
# 手调分片是唯一维护点：预算（time_limit/job_timeout）、分片组合、fetch
# 目标的历史决策注释随块保留。discover-shards job 读本文件 + runner 源码
# 套件清单（main.rs match 臂），不在任何分片里的套件按 ci-catchall.tsv
# （fetch 目标覆写）自动打包成 catch-all 分片追加进 matrix——新 runner
# 套件零 CI 编辑即入账。改本文件无需动 weekly.yml。
shards:
  # time_limit（秒）按 2026-10-27 本地实测 ×2 系数定：html-semantics 4732s、
  # csp 3494s、uievents 1513s、dom 900s。css-variables 曾因病态内存
  # （单进程 >8.8GB 三跑被杀）不进 CI——2026-10-30 M2 解禁：病态案
  # （variable-exponential-blowup.html 单案 4.9GB + *-crash.html）由
  # runner 谓词名级排除后单进程入账（css-testharness-compat DC-3）。
  # 原 sec-render 五套件一 job 撞 90min timeout（svg 被杀 webgl 未跑，
  # aggregate 连带 skip）→ 拆 sec/render 两分片（run 40505731836）。
  - name: syntax-dom
    suites: "html-syntax dom"
    fetch: "fetch-wpt-html-syntax fetch-wpt-dom"
    fetch_scripts: ""
    time_limit: 3600
  - name: crypto
    suites: "webcrypto"
    fetch: "fetch-wpt-webcrypto"
    fetch_scripts: ""
    # 2026-11-09 v3 全语料接入（HEAD 布局 69,795 keys，phase-1 33,109 的
    # 2.1 倍）：1800 按 phase-1 体量定，随全量语料放宽到 3600；楔死期临时
    # 7200（r3–r5 derived_bits_length 楔死，6a10ddaf8）随 deriveBits
    # [EnforceRange] 根因修复回落 3600：r6 全语料本地实证 238s（2026-11-10）。
    time_limit: 3600
  - name: html-sem
    suites: "html-semantics web-components"
    fetch: "fetch-wpt-html-semantics fetch-wpt-web-components"
    fetch_scripts: ""
    time_limit: 10800
  # 2026-11-11 wptfyi-editing DC-2 扩面：selection 移出 ui-edit 独立成片——
  # 旧 fetch-selection-subset.sh 显式清单 ~60 案只入账 31/231 覆盖文件（11-10
  # 快照 2,821 过）；fetch-wpt-selection 已切 23 号 lib.sh deep 拉取（~184 案 +
  # 拉取完成标记幂等）。runner selection 通道递归扫 selection/ + flat 扫
  # editing/ + editing/other（SELECTION_TEST_SUBDIRS）——fetch 须带 fetch-wpt-editing
  # 供后两目录；与 editing-run 11 片 / editing-other catch-all 的路径重叠由
  # 对账器按路径 max 语义去重（merge_zw_results 最完整一次执行胜出，不双记）。
  - name: selection-face
    suites: "selection"
    fetch: "fetch-wpt-selection fetch-wpt-editing"
    fetch_scripts: ""
    script_timeout: 300000
    case_timeout: 300
    time_limit: 7200
