[package]
name = "zero-wpt-runner"
description = "ZeroWeb WPT 测试运行器 — WPT testharness/reftest、Chromium Oracle 像素对比与兼容性工具"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["v8"]
v8 = ["zero-engine/v8", "zero-webview/v8", "zero-script-sandbox/v8"]
quickjs = ["zero-engine/quickjs", "zero-webview/quickjs", "zero-script-sandbox/quickjs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
zero-engine = { workspace = true }
zero-page-runtime = { workspace = true }
zero-net = { workspace = true }
zero-dom = { workspace = true }
zero-css-parser = { workspace = true }
zero-style-system = { workspace = true }
zero-layout-engine = { workspace = true }
zero-render-foundation = { workspace = true }
zero-script-sandbox = { workspace = true }
zero-webview = { workspace = true }
# media-playback M1b：<video> 首帧解码注入 ImageCache（reftest e2e 通路）
zero-media = { workspace = true }
png = "0.17"
rayon = "1"
base64 = "0.22"
percent-encoding = "2"
# s115：classic 外链脚本响应解码序（BOM > ct charset 参数 > charset 属性 > UTF-8）
encoding_rs = { workspace = true }
# net-api M5-S1：内嵌 WS fixture 端点握手 accept 推导（ws_fixture.rs）
sha1 = { workspace = true }
tracing-subscriber = { workspace = true }
# perf 子命令 macOS 峰值 RSS（getrusage）用；0.2.x 已在依赖树中
libc = "0.2"

[dev-dependencies]
