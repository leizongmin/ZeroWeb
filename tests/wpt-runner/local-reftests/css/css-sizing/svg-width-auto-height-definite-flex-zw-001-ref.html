<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ref: same layout with explicitly sized svg width:272px</title>
<!-- zw-local ref：与 test 唯一差异 = svg 显式 width:272px（等价 used 尺寸），用于判别 transferred
     宽是否被正确保留（R5106）。 -->
<style>
body { margin: 0; }
.c { display: flex; align-items: center; width: 400px; height: 120px; }
.w { display: block; position: relative; height: 100%; max-height: 92px; background: #eee; }
</style>
</head>
<body>
<div class="c"><div class="w">
  <svg width="272" height="92" viewBox="0 0 272 92" style="width:272px;max-width:100%;max-height:100%;object-fit:contain" xmlns="http://www.w3.org/2000/svg"><rect width="272" height="92" fill="#3186FF"/></svg>
</div></div>
</body>
</html>
