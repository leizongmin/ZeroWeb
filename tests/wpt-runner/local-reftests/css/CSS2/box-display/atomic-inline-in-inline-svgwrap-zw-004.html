<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>slice19 R4938 S-TE3 probe: inline svg wraps to the second line inside an inline element</title>
<!-- zw-local: S-TE3 多行探针案——svg 换行到第二行时行位是否随 IFC 片段同步
     （sync 判据不含 svg 型，te 探针未覆盖多行）。先探后钉：两臂一致才保留本钉，
     不一致则撤钉记挂账。 -->
<style>
body { margin: 0; }
input { display: inline-block; margin: 0; padding: 0; border: 0; background: #03c; vertical-align: top; }
</style>
</head>
<body>
<div style="width:300px"><span><input style="width:200px;height:40px"><svg width="200" height="40" style="vertical-align:top"><rect width="200" height="40" fill="#c30"/></svg></span></div>
</body>
</html>
