<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>slice19 R4938: atomic inline-level descendants inside an inline element keep their boxes</title>
<!-- zw-local: R2156 inline_box_model_coherence skip 路径曾整棵丢弃 span 内原子行内级后代
     的 taffy 子树 → 无 LayoutBox → 不绘制（IFC 行高仍由收集项撑起，故信号 = input
     矩形本体像素）。本案钉绘制契约：span 内 input 必须与直接位于块容器下时像素一致
     （CSS2 §9.2.1.1 inline formatting；§10.3.1 replaced inline）。 -->
<style>
body { margin: 0; }
input { display: inline-block; margin: 0; padding: 0; border: 0; background: #03c; vertical-align: top; }
</style>
</head>
<body>
<div><span><input style="width:360px;height:40px"><input style="width:240px;height:60px"></span></div>
</body>
</html>
