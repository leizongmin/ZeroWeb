<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>slice19 R4938 S-TE2: atomic inline-level descendants wrap across lines inside an inline element</title>
<!-- zw-local: S-TE2（pr61 testeff te3/te4 证两臂逐值一致）——span 内双 200px input
     在 300px 容器强制换行，行位 y 定位契约（第二行 input.y = 第一行行高）。
     ref 去 span 包装（直接子形态）。CSS2 §9.2.1.1 inline formatting。 -->
<style>
body { margin: 0; }
input { display: inline-block; margin: 0; padding: 0; border: 0; background: #03c; vertical-align: top; }
</style>
</head>
<body>
<div style="width:300px"><span><input style="width:200px;height:40px"><input style="width:200px;height:40px"></span></div>
</body>
</html>
