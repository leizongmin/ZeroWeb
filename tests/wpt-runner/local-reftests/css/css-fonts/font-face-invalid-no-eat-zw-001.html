<!-- 本地自建 reftest（2026-10-12 P9-8/R5105）：CSS Syntax 3 §consume_an_at_rule——
     无效 at-rule 只丢弃自身 extent，不得波及后续规则。@font-face 的两条 None 路径
     （无 `{`；族名或 url() 源为空，如 `src: local(Arial)`）都已消费完自身 extent，
     旧逻辑在 caller 再走 skip_malformed_qualified_rule 会吞掉下一条合法规则
     （github.com marketing.css：MonaSansFallback 后邻 face 被吞，fonts 3/5）。
     缺陷态：下方 div 规则被吞 → 无绿底，与 ref 像素不等；修复态两页逐像素相等。
     账本：tests/wpt-runner/imported-tests.txt；wpt-data 为独立 repo（gitignored），
     重拉后按主仓 tests/wpt-runner/local-reftests/ 同路径文件恢复并重跑
     make import-wpt 重建 manifest。本页另有内联孪生（make reftest 常驻集）：
     tests/wpt-runner/src/reftest_data/css_fonts.rs
     id css-fonts/font-face-invalid-no-eat-zw-001——两处需同步维护。 -->
<style>
@font-face { font-family: Fb; src: local(Arial); }
div { background-color: rgb(0, 128, 0); color: rgb(255, 255, 255); font-size: 32px; }
</style>
</head>
<body>
<div>survivor rule</div>
</body>
