<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="match" href="draw-scissor-zw-004-ref.html">
<title>WebGL drawArrays fullscreen triangle + scissor</title>
<!-- 本地自建 reftest（2026-10-23 webgl-compat goal M3-S4）：全屏超大三角
     （-1,-1 / 3,-1 / -1,3 覆盖整 clip 方域）drawArrays 实心蓝，再
     enable(SCISSOR_TEST) + scissor(0,0,50,25)（GL 底左原点 → host 左下
     50×25）重绘红 → 左下红、其余蓝。缺陷态：viewport 换算/scissor host
     rect 换算/绘制间 retained buffer 读改写任一环错位 → 与 ref 像素不等。
     spec：https://www.khronos.org/registry/webgl/specs/latest/1.0/#5.14.3
     （drawArrays）/ #5.14.4（scissor——GL 窗口坐标原点在左下）。
     账本：tests/wpt-runner/imported-tests.txt；wpt-data 为独立 repo
     （gitignored），重拉后按主仓 tests/wpt-runner/local-reftests/ 同路径文件
     恢复并重跑 make import-wpt 重建 manifest。本页另有内联孪生（make reftest
     常驻集）：tests/wpt-runner/src/reftest_data/webgl.rs
     id webgl/draw-scissor-zw-004——两处需同步维护。 -->
</head>
<body style="margin:0">
<canvas id="cv" width="100" height="50" style="display:block"></canvas>
<script>
var gl = document.getElementById('cv').getContext('webgl');
var vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, 'attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }');
gl.compileShader(vs);
var fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, 'precision mediump float; uniform vec4 u_color; void main() { gl_FragColor = u_color; }');
gl.compileShader(fs);
var p = gl.createProgram();
gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p); gl.useProgram(p);
var vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(p, 'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform4f(gl.getUniformLocation(p, 'u_color'), 0, 0, 1, 1);
gl.drawArrays(gl.TRIANGLES, 0, 3);
gl.enable(gl.SCISSOR_TEST);
gl.scissor(0, 0, 50, 25);
gl.uniform4f(gl.getUniformLocation(p, 'u_color'), 1, 0, 0, 1);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body>
</html>
