[package]
name = "zero-engine"
description = "页面内核 — HTML/DOM/CSSOM/样式/布局/绘制/脚本协调"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["v8"]
v8 = ["zero-script-sandbox/v8"]
quickjs = ["zero-script-sandbox/quickjs"]

[dependencies]
zero-product-version = { workspace = true }
zero-dom = { workspace = true }
zero-css-parser = { workspace = true }
zero-style-system = { workspace = true }
zero-layout-engine = { workspace = true }
zero-render-foundation = { workspace = true }
zero-canvas = { workspace = true }
zero-net = { workspace = true }
zero-security = { workspace = true }
zero-script-sandbox = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
slotmap = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
getrandom = { workspace = true }
png = { workspace = true }
flate2 = "1"

[dev-dependencies]
criterion = { workspace = true }
zero-css-parser = { workspace = true }

[[bench]]
name = "engine_bench"
harness = false
