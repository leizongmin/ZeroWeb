[package]
name = "zero-engine"
description = "页面内核 — HTML/DOM/CSSOM/样式/布局/绘制/脚本协调"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["v8"]
script-runtime = ["dep:zero-script-sandbox"]
v8 = ["script-runtime", "zero-script-sandbox/v8", "dep:v8"]
quickjs = ["script-runtime", "zero-script-sandbox/quickjs", "dep:rquickjs"]

[dependencies]
zero-product-version = { workspace = true }
zero-runtime-config = { workspace = true }
zero-dom = { workspace = true }
zero-css-parser = { workspace = true }
zero-style-system = { workspace = true }
zero-layout-engine = { workspace = true }
zero-render-foundation = { workspace = true }
zero-canvas = { workspace = true }
zero-net = { workspace = true }
zero-security = { workspace = true }
zero-script-sandbox = { workspace = true, optional = true }
simplecss = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
slotmap = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
ctr = { workspace = true }
# webcrypto-compat-v3 域切片（D1 拍板 2026-11-02）——AES-OCB/ChaCha20-Poly1305/Argon2。
# aes 0.9 钉版：ocb3 0.2 构建于 cipher 0.5 线，与上方 aes 0.8（cipher 0.4，aes-gcm/cbc/ctr
# 面）双 major 共存（拍板明示方案，MSRV 预检见 docs/goal/webcrypto-compat-v3/
# evidence/2026-11-02-dc2-msrv-compile-precheck.md）；钉 =0.9.2 防 cargo update 漂入 1.87+。
# ctutils 钉版：ocb3/cipher 0.5 传递依赖，0.4.3+ 要求 rustc 1.87（同一预检 evidence）。
aes09 = { version = "=0.9.2", package = "aes" }
ctutils = "=0.4.2"
argon2 = { workspace = true }
ocb3 = { workspace = true }
chacha20poly1305 = { workspace = true }
rsa = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
getrandom = { workspace = true }
png = { workspace = true }
flate2 = "1"
unicode-bidi = { workspace = true }
# encoding-compat M2：TextDecoder legacy 解码 + labels 标签表（encoding 标准 tables——
# encoding_rs 即 WHATWG 编码表生成实现，zero-net 同款工作区依赖）。
encoding_rs = { workspace = true }

# P1b S1 原生 DOM 绑定（feature-gated v8）。与 script-sandbox 同版本同 feature 对齐，
# Cargo 去重同一 v8 crate 实例。quickjs 模式下不启用（本 crate 原生绑定仅 V8）。
[dependencies.v8]
version = "150.2.0"
default-features = false
optional = true

# js-dom goal M6 S0q：QuickJS 原生 DOM 绑定（feature-gated quickjs）。与 script-sandbox
# 同版本同 feature 对齐（bindgen），Cargo 去重同一 rquickjs crate 实例。v8 模式下不启用。
[dependencies.rquickjs]
version = "0.7"
optional = true
features = ["bindgen"]

[dev-dependencies]
criterion = { workspace = true }
zero-css-parser = { workspace = true }

[[bench]]
name = "engine_bench"
harness = false

# P1b S1 原生 DOM 绑定 vs polyfill 字符串桥单次读取开销对照（RFC §4 S0 bench gate）。
# 仅 v8 feature（quickjs 模式无原生绑定）。
[[bench]]
name = "dom_bindings_bench"
harness = false
required-features = ["v8"]
