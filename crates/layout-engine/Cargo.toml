[package]
name = "zero-layout-engine"
description = "布局引擎 — 基于 taffy 扩展，支持 Block/Inline/Flexbox/Grid"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
taffy = { workspace = true, features = ["float_layout"] }
zero-dom = { workspace = true }
zero-style-system = { workspace = true }
zero-css-parser = { workspace = true }
zero-render-foundation = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
unicode-bidi = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
zero-style-system = { workspace = true }
zero-css-parser = { workspace = true }
slotmap = { workspace = true }

[[bench]]
name = "layout_bench"
harness = false

