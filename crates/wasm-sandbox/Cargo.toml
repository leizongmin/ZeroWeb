[package]
name = "zero-wasm-sandbox"
description = "非页面 WASM 运行时（Wasmtime/wasmi）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

[features]
default = ["wasmi"]
wasmtime = ["dep:wasmtime"]
wasmi = ["dep:wasmi"]

[dependencies.wasmtime]
version = "29"
default-features = false
optional = true

[dependencies.wasmi]
version = "0.40"
optional = true

[dev-dependencies]
wat = "1"
