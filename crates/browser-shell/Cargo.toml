[package]
name = "zero-browser-shell"
description = "浏览器应用层 — 多标签页、收藏夹、地址栏、历史"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["v8"]
v8 = ["zero-webview/v8"]
quickjs = ["zero-webview/quickjs"]

[dependencies]
zero-webview = { workspace = true }
zero-host-runtime = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "browser_shell_bench"
harness = false
