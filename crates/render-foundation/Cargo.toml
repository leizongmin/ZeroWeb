[package]
name = "zero-render-foundation"
description = "渲染基础设施 — GPU/CPU 渲染、字体栈、图片缓存（源自 OmniTerm）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu = { workspace = true }
fontdue = { workspace = true }
swash = { workspace = true }
rustybuzz = { workspace = true }
png = "0.17"
jpeg-decoder = "0.3"
flate2 = "1"
resvg = { workspace = true }
tiny-skia = "0.11"
bytemuck = { workspace = true, features = ["derive"] }
hashbrown = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
# FreeType（chromium Linux 同栈光栅化器）——可选，仅 `freetype-raster` feature 启用。
# 默认关：CI / 默认构建保持纯 Rust（fontdue 光栅化）。feature 开时本地 A/B 验证
# Phase 2（fontdue→FreeType 光栅化替换）的 font-wall 收敛收益（R1066-R1067 scoping）。
# 详见 docs/goal/rendering-compat/fontdue-replacement-scoping.md（v0.4）。
freetype-rs = { version = "0.38", optional = true }

[features]
# 启用 FreeType 光栅化路径（`rasterize_glyph` 的 fontdue→FreeType 替换）。default 关。
# 经 `freetype-rs/bundled` 从 C 源码编译 FreeType2 + libpng（freetype-sys `bundled`），
# 无须系统 FreeType → CI 三平台（ubuntu/macos/windows）一致可用（R1071 de-risk 验证）。
freetype-raster = ["dep:freetype-rs", "freetype-rs/bundled"]

[dev-dependencies]
criterion = { workspace = true }
serial_test = { workspace = true }

[[bench]]
name = "render_bench"
harness = false
