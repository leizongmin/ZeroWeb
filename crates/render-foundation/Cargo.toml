[package]
name = "zero-render-foundation"
description = "渲染基础设施 — GPU/CPU 渲染、字体栈、图片缓存（源自 OmniTerm）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu = { workspace = true }
fontdue = { workspace = true }
swash = { workspace = true }
rustybuzz = { workspace = true }
wuff = { workspace = true }
png = "0.17"
jpeg-decoder = "0.3"
image-webp = "0.2"
flate2 = "1"
base64 = "0.22"
resvg = { workspace = true }
tiny-skia = "0.11"
bytemuck = { workspace = true, features = ["derive"] }
hashbrown = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
unicode-segmentation = { workspace = true }
parking_lot = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
zero-protocol = { workspace = true }
zero-runtime-config = { workspace = true }

# FreeType（chromium Linux 同栈光栅化器）——经 `freetype-raster` feature 启用（R1159 起为 default）。
# 默认构建即编译 FreeType2 C 源（`freetype-rs/bundled`），非-Ahem 字形优先 FreeType 光栅化。
# 全 corpus oracle 实测 +232 零回归（R1094 A/B）。需纯 Rust 构建用 `--no-default-features`。
# 详见 docs/goal/rendering-compat/fontdue-replacement-scoping.md。
freetype-rs = { version = "0.38", optional = true }

[features]
# FreeType 光栅化路径（`rasterize_glyph` 的 fontdue→FreeType 替换）。
# default 开（R1159 翻默认）：非-Ahem 字形优先 FreeType 光栅化（chromium Linux 同栈），
# 全 corpus oracle 实测 +232 零回归（R1094 A/B）。经 `freetype-rs/bundled` 从 C 源码编译
# FreeType2 + libpng（freetype-sys `bundled`），无须系统 FreeType → CI 三平台一致可用
# （R1071 de-risk 验证 6-target matrix）。需纯 Rust 构建时：`--no-default-features`。
default = ["freetype-raster"]
freetype-raster = ["dep:freetype-rs", "freetype-rs/bundled"]

[dev-dependencies]
criterion = { workspace = true }
serial_test = { workspace = true }

# dma-buf 导出（compositor RFC 4.3-S5）使用 libc 系统调用；仅 Linux
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bench]]
name = "render_bench"
harness = false
