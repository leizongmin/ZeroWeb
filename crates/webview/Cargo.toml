[package]
name = "zero-webview"
description = "面向外部应用的稳定嵌入接口"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zero-engine = { workspace = true }
zero-runtime-config = { workspace = true }
zero-page-runtime = { workspace = true }
zero-host-runtime = { workspace = true }
zero-media = { workspace = true }
zero-render-foundation = { workspace = true }
zero-protocol = { workspace = true }
zero-net = { workspace = true }
zero-script-sandbox = { workspace = true }
zero-storage = { workspace = true }
zero-wasm-sandbox = { workspace = true }
zero-security = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

[features]
default = ["v8"]
v8 = ["zero-engine/v8", "zero-page-runtime/v8", "zero-script-sandbox/v8"]
quickjs = ["zero-engine/quickjs", "zero-page-runtime/quickjs", "zero-script-sandbox/quickjs"]
# AV1 解码（media-playback M3 / D-RFC-2）：转发 zero-media decode-av1（dav1d）——
# settle 探针 `probe_video_media_meta`（open_webm codec 自路由）与播放面同 codec 面。
decode-av1 = ["zero-media/decode-av1"]

[dev-dependencies]
criterion = { workspace = true }
png = "0.17"
serial_test = { workspace = true }

[[bench]]
name = "webview_bench"
harness = false

[[test]]
name = "webview_coverage"
path = "src/tests/webview_coverage.rs"
