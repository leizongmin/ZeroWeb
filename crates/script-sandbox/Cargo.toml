[package]
name = "zero-script-sandbox"
description = "扩展/用户脚本引擎（V8/QuickJS feature gate）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

[features]
default = ["v8"]
v8 = ["dep:rusty_v8"]
quickjs = ["dep:rquickjs"]

[dependencies.rusty_v8]
package = "v8"
version = "150.2.0"
default-features = false
optional = true

[dependencies.rquickjs]
version = "0.7"
optional = true
features = ["bindgen"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "script_sandbox_bench"
harness = false
