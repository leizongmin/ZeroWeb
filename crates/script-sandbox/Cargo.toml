[package]
name = "zero-script-sandbox"
description = "扩展/用户脚本引擎（V8/QuickJS feature gate）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

[features]
default = []
v8 = ["rusty_v8"]
quickjs = ["rquickjs"]

[dependencies.rusty_v8]
version = "0.32"
default-features = false
optional = true

[dependencies.rquickjs]
version = "0.7"
optional = true

[dev-dependencies]
