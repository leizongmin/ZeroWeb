[package]
name = "zero-script-sandbox"
description = "扩展/用户脚本引擎（V8/QuickJS feature gate）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

[features]
default = ["v8"]
v8 = ["dep:v8"]
quickjs = ["dep:rquickjs"]

[dependencies.v8]
version = "150.2.0"
default-features = false
optional = true

[dependencies.rquickjs]
version = "0.7"
optional = true
features = ["bindgen"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "script_sandbox_bench"
harness = false
# 基准对象 V8Sandbox/WorkerRuntime 仅 v8 feature 下存在；quickjs 模式跳过本
# target，否则 --all-targets 编译矩阵（如 make test quickjs 检查）会被 bench
# 的 unresolved import 阻断。
required-features = ["v8"]
