[package]
name = "zero-ui-render"
description = "通用 UI SDK 渲染/场景抽象 — scene/render node/paint context/hit-test（浏览器无关，不直接依赖 render-foundation 后端）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zero-ui-core = { workspace = true }
# DC-11 phase 2：ui/render 把文本绘制消费 foundation/text 的 TextBlob（预 shape 文本单元）。
# foundation/text 是纯文本层（不依赖 render-foundation GPU 后端），不违反 TBD-2 / DC-1。
zero-text-foundation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
