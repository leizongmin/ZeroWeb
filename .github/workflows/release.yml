name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-aarch64-status:
    name: Windows ARM64 release status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check rusty_v8 Windows ARM64 archive
        shell: bash
        run: |
          version="$(sed -n '/name = "v8"/{n;s/^version = "//;s/"$//;p;q;}' Cargo.lock)"
          base_url="https://github.com/denoland/rusty_v8/releases/download/v${version}/rusty_v8_release_aarch64-pc-windows-msvc.lib.gz"
          if curl --fail --head --silent --location "$base_url" >/dev/null || curl --fail --head --silent --location "${base_url}.gz" >/dev/null; then
            {
              echo "## Windows ARM64 release"
              echo
              echo "rusty_v8 v${version} publishes a Windows ARM64 archive. Add aarch64-pc-windows-msvc back to the release matrix."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Windows ARM64 release"
              echo
              echo "Skipped: rusty_v8 v${version} does not publish a Windows ARM64 native archive, so ZeroBrowser cannot produce a V8-backed Windows ARM64 release artifact yet."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-release:
    name: Build ${{ matrix.target }} (${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # windows-aarch64: freetype-sys NEON 汇编问题（已知上游 bug），不阻塞 release
    continue-on-error: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每种平台出 v8 与 quickjs 两个引擎的产物；windows-aarch64 无 v8（rusty_v8 不发布该目标原生库），只有 quickjs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zero-browser-linux-x86_64-v8
            engine: v8
            ext: ''
            features: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zero-browser-linux-x86_64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zero-browser-linux-aarch64-v8
            engine: v8
            ext: ''
            features: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zero-browser-linux-aarch64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zero-browser-macos-x86_64-v8
            engine: v8
            ext: ''
            features: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zero-browser-macos-x86_64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zero-browser-macos-aarch64-v8
            engine: v8
            ext: ''
            features: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zero-browser-macos-aarch64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zero-browser-windows-x86_64-v8
            engine: v8
            ext: '.exe'
            features: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zero-browser-windows-x86_64-quickjs
            engine: quickjs
            ext: '.exe'
            features: '--no-default-features --features quickjs'
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: zero-browser-windows-aarch64-quickjs
            engine: quickjs
            ext: '.exe'
            features: '--no-default-features --features quickjs'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine rusty_v8 version
        if: matrix.engine == 'v8'
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = "v8"/{n;s/^version = "//;s/"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        if: matrix.engine == 'v8'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zero-web/rusty_v8
            ~/Library/Caches/zero-web/rusty_v8
            ~/AppData/Local/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.engine }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.engine }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - name: Download rusty_v8 archive
        if: runner.os != 'Windows' && matrix.engine == 'v8'
        shell: bash
        run: RUSTY_V8_TARGET=${{ matrix.target }} bash scripts/download-rusty-v8.sh

      - name: Configure rusty_v8 archive on Windows
        if: runner.os == 'Windows' && matrix.engine == 'v8'
        shell: bash
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/rusty_v8_release_${{ matrix.target }}.lib.gz" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=advapi32.lib" >> "$GITHUB_ENV"

      - name: Install zlib via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.target }}' -match 'aarch64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
          Write-Host "Installing zlib:$triplet via vcpkg..."
          vcpkg install zlib --triplet $triplet
          $vcpkgInclude = "C:\vcpkg\installed\$triplet\include"
          $vcpkgLib = "C:\vcpkg\installed\$triplet\lib"
          "CFLAGS=-I$vcpkgInclude" >> $env:GITHUB_ENV
          "INCLUDE=$vcpkgInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$vcpkgLib;$env:LIB" >> $env:GITHUB_ENV
          Write-Host "vcpkg zlib installed, CFLAGS/INCLUDE/LIB set to $vcpkgInclude"

      - name: Configure MSVC include paths for clang/bindgen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" }
          Write-Host "VS installation: $vsPath"
          $msvcVer = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdkVer = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($msvcVer -and $sdkVer) {
            $msvcInc = "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\include"
            $sdkUcrt = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\ucrt"
            $sdkUm = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\um"
            $sdkShared = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\shared"
            $clangArgs = "-isystem`"$msvcInc`" -isystem`"$sdkUcrt`" -isystem`"$sdkUm`" -isystem`"$sdkShared`""
            "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs" >> $env:GITHUB_ENV
            Write-Host "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs"
          } else {
            Write-Host "WARNING: could not locate MSVC/SDK include paths"
          }

      - name: Patch freetype-sys filter_neon.S for MSVC (windows-aarch64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -e
          cargo fetch --target ${{ matrix.target }}
          CRATE_FILE=$(find "$CARGO_HOME/registry/cache" -name "freetype-sys-0.23.0.crate" 2>/dev/null | head -1)
          if [ -z "$CRATE_FILE" ]; then
            echo "ERROR: freetype-sys-0.23.0.crate not found in cache"
            exit 1
          fi
          echo "Patching $CRATE_FILE: removing filter_neon.S from build.rs"
          MSYS2_CRATE=$(cygpath -u "$CRATE_FILE")
          TMPDIR=$(mktemp -d)
          tar xzf "$MSYS2_CRATE" -C "$TMPDIR"
          find "$TMPDIR" -name "build.rs" -exec sed -i '/filter_neon\.S/d' {} \;
          (cd "$TMPDIR/freetype-sys-0.23.0" && rm -f .cargo-checksum.json && find . -type f -exec sha256sum {} \; | sort -k 2 > .cargo-checksum.json)
          tar czf "$MSYS2_CRATE" -C "$TMPDIR" freetype-sys-0.23.0
          rm -rf "$TMPDIR"
          rm -rf $(find "$CARGO_HOME/registry/src" -name "freetype-sys-0.23.0" -type d 2>/dev/null)
          echo "Patch applied."

      - name: Build release
        run: |
          cargo build --release --bin zero-browser --target ${{ matrix.target }}
          cargo build ${{ matrix.features }} --release --bin zero-renderer --target ${{ matrix.target }}
          cargo build --release --bin zero-compositor --bin zero-image-decoder --target ${{ matrix.target }}

      - name: Strip binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/zero-browser${{ matrix.ext }}
          strip target/${{ matrix.target }}/release/zero-renderer${{ matrix.ext }}
          strip target/${{ matrix.target }}/release/zero-compositor${{ matrix.ext }}
          strip target/${{ matrix.target }}/release/zero-image-decoder${{ matrix.ext }}

      - name: Create output directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zero-browser${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-renderer${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-compositor${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-image-decoder${{ matrix.ext }} dist/

      - name: Create README for distribution
        shell: bash
        run: |
          cat > dist/README.txt << 'EOF'
          ZeroBrowser — A cross-platform browser built with Rust

          JavaScript engine: ${{ matrix.engine }}

          This archive contains four executables that MUST stay in the same
          directory:
          - zero-browser   — main browser process (UI, tabs, network)
          - zero-renderer  — render subprocess (spawned by zero-browser)
          - zero-compositor — compositor subprocess (spawned by zero-browser)
          - zero-image-decoder — image decoding subprocess (spawned by
            zero-renderer; isolates image codec bugs)

          Usage:
            ./zero-browser [URL]              Open URL
            ./zero-browser --headless          Run in headless mode
            ./zero-browser --remote-debugging-port=9222  Enable remote debugging

          License: MIT
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7

  package-linux:
    name: Package Linux .deb (${{ matrix.arch }})
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # v8 与 quickjs 各出 .deb；包名/安装路径一致（/usr/bin/zero-browser），
          # 仅文件名带引擎后缀区分，用户只能同时安装其中一个版本
          - artifact: zero-browser-linux-x86_64-v8
            arch: amd64
            engine: v8
          - artifact: zero-browser-linux-x86_64-quickjs
            arch: amd64
            engine: quickjs
          - artifact: zero-browser-linux-aarch64-v8
            arch: arm64
            engine: v8
          - artifact: zero-browser-linux-aarch64-quickjs
            arch: arm64
            engine: quickjs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Make binaries executable
        run: |
          chmod +x dist/zero-browser
          chmod +x dist/zero-renderer
          chmod +x dist/zero-compositor
          chmod +x dist/zero-image-decoder

      - name: Build .deb package
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          DEBROOT="zero-browser_${VERSION}_${{ matrix.arch }}"
          mkdir -p "$DEBROOT/DEBIAN" "$DEBROOT/usr/bin" "$DEBROOT/usr/share/applications"
          mkdir -p "$DEBROOT/usr/share/icons/hicolor/scalable/apps"
          cp dist/zero-browser dist/zero-renderer dist/zero-compositor dist/zero-image-decoder "$DEBROOT/usr/bin/"
          chmod 755 "$DEBROOT/usr/bin/zero-browser" "$DEBROOT/usr/bin/zero-renderer" "$DEBROOT/usr/bin/zero-compositor" "$DEBROOT/usr/bin/zero-image-decoder"

          # 应用图标（SVG + 已生成的 PNG 各尺寸）
          cp apps/browser/assets/app-icon.svg "$DEBROOT/usr/share/icons/hicolor/scalable/apps/zero-browser.svg"
          for size in 16 32 48 128 256 512; do
            png="apps/browser/assets/icons-gen/icon-${size}.png"
            if [[ -f "$png" ]]; then
              mkdir -p "$DEBROOT/usr/share/icons/hicolor/${size}x${size}/apps"
              cp "$png" "$DEBROOT/usr/share/icons/hicolor/${size}x${size}/apps/zero-browser.png"
            fi
          done

          SIZE=$(du -sk "$DEBROOT/usr" | cut -f1)
          cat > "$DEBROOT/DEBIAN/control" << EOF
          Package: zero-browser
          Version: ${VERSION}
          Section: web
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Installed-Size: ${SIZE}
          Maintainer: ZeroWeb Team <zeroweb@example.com>
          Description: ZeroBrowser - A cross-platform browser built with Rust
          Homepage: https://zeroweb.leizm.com
          Depends: libc6 (>= 2.31)
          EOF

          cat > "$DEBROOT/usr/share/applications/zero-browser.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=ZeroBrowser
          Comment=A cross-platform browser built with Rust
          Exec=/usr/bin/zero-browser %u
          Icon=zero-browser
          Type=Application
          Categories=Network;WebBrowser;
          DESKTOP

          dpkg-deb --build "$DEBROOT" "dist/zero-browser-${{ matrix.engine }}_${VERSION}_${{ matrix.arch }}.deb"
          rm -rf "$DEBROOT"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zero-browser-linux-${{ matrix.arch }}-${{ matrix.engine }}-deb
          path: dist/*.deb
          retention-days: 7

  package-macos:
    name: Package macOS .app (${{ matrix.arch }})
    needs: build-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: zero-browser-macos-x86_64-v8
            arch: x86_64
            os: macos-15-intel
            engine: v8
          - artifact: zero-browser-macos-x86_64-quickjs
            arch: x86_64
            os: macos-15-intel
            engine: quickjs
          - artifact: zero-browser-macos-aarch64-v8
            arch: aarch64
            os: macos-latest
            engine: v8
          - artifact: zero-browser-macos-aarch64-quickjs
            arch: aarch64
            os: macos-latest
            engine: quickjs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/zero-browser-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build macOS app archive
        shell: bash
        run: |
          # package-macos.sh 要求 YY.M.D 格式（CFBundleVersion 日期语义，
          # 与 scripts/package-macos.sh 默认及产品版本推导一致）；tag 名（如
          # v0.1.0-test）不满足该格式，这里用构建日期
          VERSION="$(date +%y.%-m.%-d)"
          args=(
            --browser dist/zero-browser
            --renderer dist/zero-renderer
            --compositor dist/zero-compositor
            --decoder dist/zero-image-decoder
            --output-dir package
            --version "$VERSION"
            --archive "dist/${{ matrix.artifact }}.zip"
          )
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            args+=(--sign-identity "$MACOS_SIGN_IDENTITY")
          fi
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            args+=(--notarize)
          else
            echo "::warning::macOS archive is not notarized; configure Developer ID and Apple notary secrets to avoid Gatekeeper prompts."
          fi
          scripts/package-macos.sh "${args[@]}"

      - name: Upload macOS app archive
        uses: actions/upload-artifact@v4
        with:
          name: zero-browser-macos-${{ matrix.arch }}-${{ matrix.engine }}-app
          path: dist/${{ matrix.artifact }}.zip
          retention-days: 7

  create-release:
    name: Upload release assets
    needs: [build-release, package-linux, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | head -20

      # Linux/Windows 构建产物平铺上传会导致多平台同名文件（zero-browser、
      # README.txt 等）互相覆盖，平台区分丢失——与 weekly 一致，按平台打成 zip。
      # 精确列出平台目录：glob 会误匹配 -deb 目录（如 zero-browser-linux-amd64-v8-deb/）
      - name: Repackage Linux/Windows zips
        shell: bash
        run: |
          set -e
          cd artifacts
          for name in \
            zero-browser-linux-x86_64-v8 zero-browser-linux-x86_64-quickjs \
            zero-browser-linux-aarch64-v8 zero-browser-linux-aarch64-quickjs \
            zero-browser-windows-x86_64-v8 zero-browser-windows-x86_64-quickjs \
            zero-browser-windows-aarch64-quickjs; do
            (cd "$name" && zip -r "../${name}.zip" .)
            rm -rf "$name"
          done

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \
            ! -path './zero-browser-macos-*-v8/*' \
            ! -path './zero-browser-macos-*-quickjs/*' \
            -print0 | sort -z | xargs -0 sha256sum > ../checksums-sha256.txt
          cd ..
          cat checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            checksums-sha256.txt
            artifacts/zero-browser-linux-*.zip
            artifacts/zero-browser-windows-*.zip
            artifacts/zero-browser-linux-amd64-v8-deb/*
            artifacts/zero-browser-linux-amd64-quickjs-deb/*
            artifacts/zero-browser-linux-arm64-v8-deb/*
            artifacts/zero-browser-linux-arm64-quickjs-deb/*
            artifacts/zero-browser-macos-x86_64-v8-app/*.zip
            artifacts/zero-browser-macos-x86_64-quickjs-app/*.zip
            artifacts/zero-browser-macos-aarch64-v8-app/*.zip
            artifacts/zero-browser-macos-aarch64-quickjs-app/*.zip
