name: FreeType raster cross-platform

# R1081：把 R1073 嵌在 ci.yml 的 freetype-raster-cross-platform job 抽成独立 workflow，
# 使 C-dep 决策（翻 freetype-raster default）所需的 6-target 编译验证可**一键独立 dispatch**
#（不连带跑全量 CI）。仅 workflow_dispatch 触发（非每 push）；非阻塞（continue-on-error）。
#
# 通过 → bundled freetype-sys 在三 OS（含 ARM 变体）全编译，翻 default CI 零风险；
# 失败 → 精确定位哪个 target 的 C 工具链/源码不兼容。证据见 docs/goal/rendering-compat/master.md R1071-R1073。
# 用法：gh workflow run freetype-raster-cross-platform（或 GitHub Actions UI 手动触发）。

on:
  workflow_dispatch:

jobs:
  freetype-raster-cross-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ft-raster-${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ft-raster-${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install zlib via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.target }}' -match 'aarch64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
          Write-Host "Installing zlib:$triplet via vcpkg..."
          vcpkg install zlib --triplet $triplet
          $vcpkgInclude = "C:\vcpkg\installed\$triplet\include"
          $vcpkgLib = "C:\vcpkg\installed\$triplet\lib"
          # CFLAGS: cc crate appends to compiler command line (bypasses its own include logic)
          "CFLAGS=-I$vcpkgInclude" >> $env:GITHUB_ENV
          # INCLUDE/LIB: MSVC cl.exe also reads these directly
          "INCLUDE=$vcpkgInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$vcpkgLib;$env:LIB" >> $env:GITHUB_ENV
          Write-Host "vcpkg zlib installed, CFLAGS/INCLUDE/LIB set to $vcpkgInclude"

      - name: Patch freetype-sys filter_neon.S for MSVC (windows-aarch64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -e
          cargo fetch --target ${{ matrix.target }}
          CRATE_FILE=$(find "$CARGO_HOME/registry/cache" -name "freetype-sys-0.23.0.crate" 2>/dev/null | head -1)
          if [ -z "$CRATE_FILE" ]; then
            echo "ERROR: freetype-sys-0.23.0.crate not found in cache"
            exit 1
          fi
          echo "Patching $CRATE_FILE: removing filter_neon.S from build.rs"
          # filter_neon.S 是 ARM NEON 汇编，MSVC cl.exe 不识别 .S 文件（需 armasm64.exe）。
          # 同目录 filter_neon_intrinsics.c 提供等价 C intrinsics 实现。
          # 直接修改 build.rs 删除 .S 引用，更可靠。
          MSYS2_CRATE=$(cygpath -u "$CRATE_FILE")
          TMPDIR=$(mktemp -d)
          tar xzf "$MSYS2_CRATE" -C "$TMPDIR"
          find "$TMPDIR" -name "build.rs" -exec sed -i '/filter_neon\.S/d' {} \;
          (cd "$TMPDIR/freetype-sys-0.23.0" && rm -f .cargo-checksum.json && find . -type f -exec sha256sum {} \; | sort -k 2 > .cargo-checksum.json)
          tar czf "$MSYS2_CRATE" -C "$TMPDIR" freetype-sys-0.23.0
          rm -rf "$TMPDIR"
          rm -rf $(find "$CARGO_HOME/registry/src" -name "freetype-sys-0.23.0" -type d 2>/dev/null)
          echo "Patch applied."

      # 仅 check zero-render-foundation（不依赖 rusty_v8），验证 freetype-sys bundled
      # 在各 target 的 C 编译（cc crate 从源码编译 FreeType2+libpng）。
      - name: Check freetype-raster feature (bundled FreeType)
        shell: bash
        run: |
          cargo check -p zero-render-foundation --features freetype-raster --target ${{ matrix.target }}
