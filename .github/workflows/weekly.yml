name: Weekly Build

on:
  schedule:
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      # A1：dispatch 时可选只跑 reftest-trend（避免 6 平台构建矩阵）
      run_reftest_trend:
        description: 'Run reftest-trend job only (skip build matrix)'
        type: boolean
        default: false
      # 性能门禁：dispatch 时可选只跑 benchmark-trend（真实测量 + 门禁 + 趋势回写）
      run_benchmark_trend:
        description: 'Run benchmark-trend job only (skip build matrix)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new commits since last successful weekly build
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_build', 'true');
              return;
            }

            const {owner, repo} = context.repo;
            const currentSha = context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'weekly.yml',
              branch: 'main',
              status: 'success',
              event: 'schedule',
              per_page: 100,
            });
            const previous = runs.find((run) => run.id !== context.runId);
            core.setOutput('should_build', previous?.head_sha === currentSha ? 'false' : 'true');

  build:
    needs: changes
    # A1：dispatch「仅 trend」模式跳过 6 平台构建矩阵
    if: >
      needs.changes.outputs.should_build == 'true'
      && !(github.event_name == 'workflow_dispatch' && inputs.run_reftest_trend)
    name: Build ${{ matrix.target }} (${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    # windows-aarch64: freetype-sys NEON 汇编问题（已知上游 bug），不阻塞 weekly
    continue-on-error: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每种平台出 v8 与 quickjs 两个引擎的产物；windows-aarch64 无 v8（rusty_v8 不发布该目标原生库），只有 quickjs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zero-browser-linux-x86_64-v8
            engine: v8
            ext: ''
            features: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zero-browser-linux-x86_64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zero-browser-linux-aarch64-v8
            engine: v8
            ext: ''
            features: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zero-browser-linux-aarch64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zero-browser-macos-x86_64-v8
            engine: v8
            ext: ''
            features: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zero-browser-macos-x86_64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zero-browser-macos-aarch64-v8
            engine: v8
            ext: ''
            features: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zero-browser-macos-aarch64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zero-browser-windows-x86_64-v8
            engine: v8
            ext: '.exe'
            features: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zero-browser-windows-x86_64-quickjs
            engine: quickjs
            ext: '.exe'
            features: '--no-default-features --features quickjs'
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: zero-browser-windows-aarch64-quickjs
            engine: quickjs
            ext: '.exe'
            features: '--no-default-features --features quickjs'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine rusty_v8 version
        if: matrix.engine == 'v8'
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        if: matrix.engine == 'v8'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zero-web/rusty_v8
            ~/Library/Caches/zero-web/rusty_v8
            ~/AppData/Local/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.engine }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.engine }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        if: runner.os != 'Windows' && matrix.engine == 'v8'
        shell: bash
        run: RUSTY_V8_TARGET=${{ matrix.target }} bash scripts/download-rusty-v8.sh

      - name: Configure rusty_v8 archive on Windows
        if: runner.os == 'Windows' && matrix.engine == 'v8'
        shell: bash
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/rusty_v8_release_${{ matrix.target }}.lib.gz" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=advapi32.lib" >> "$GITHUB_ENV"

      - name: Install zlib via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.target }}' -match 'aarch64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
          Write-Host "Installing zlib:$triplet via vcpkg..."
          vcpkg install zlib --triplet $triplet
          $vcpkgInclude = "C:\vcpkg\installed\$triplet\include"
          $vcpkgLib = "C:\vcpkg\installed\$triplet\lib"
          "CFLAGS=-I$vcpkgInclude" >> $env:GITHUB_ENV
          "INCLUDE=$vcpkgInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$vcpkgLib;$env:LIB" >> $env:GITHUB_ENV
          Write-Host "vcpkg zlib installed, CFLAGS/INCLUDE/LIB set to $vcpkgInclude"

      - name: Configure MSVC include paths for clang/bindgen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" }
          Write-Host "VS installation: $vsPath"
          $msvcVer = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdkVer = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($msvcVer -and $sdkVer) {
            $msvcInc = "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\include"
            $sdkUcrt = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\ucrt"
            $sdkUm = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\um"
            $sdkShared = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\shared"
            $clangArgs = "-isystem`"$msvcInc`" -isystem`"$sdkUcrt`" -isystem`"$sdkUm`" -isystem`"$sdkShared`""
            "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs" >> $env:GITHUB_ENV
            Write-Host "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs"
          } else {
            Write-Host "WARNING: could not locate MSVC/SDK include paths"
          }

      - name: Patch freetype-sys filter_neon.S for MSVC (windows-aarch64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -e
          cargo fetch --target ${{ matrix.target }}
          CRATE_FILE=$(find "$CARGO_HOME/registry/cache" -name "freetype-sys-0.23.0.crate" 2>/dev/null | head -1)
          if [ -z "$CRATE_FILE" ]; then
            echo "ERROR: freetype-sys-0.23.0.crate not found in cache"
            exit 1
          fi
          echo "Patching $CRATE_FILE: removing filter_neon.S from build.rs"
          MSYS2_CRATE=$(cygpath -u "$CRATE_FILE")
          TMPDIR=$(mktemp -d)
          tar xzf "$MSYS2_CRATE" -C "$TMPDIR"
          find "$TMPDIR" -name "build.rs" -exec sed -i '/filter_neon\.S/d' {} \;
          (cd "$TMPDIR/freetype-sys-0.23.0" && rm -f .cargo-checksum.json && find . -type f -exec sha256sum {} \; | sort -k 2 > .cargo-checksum.json)
          tar czf "$MSYS2_CRATE" -C "$TMPDIR" freetype-sys-0.23.0
          rm -rf "$TMPDIR"
          rm -rf $(find "$CARGO_HOME/registry/src" -name "freetype-sys-0.23.0" -type d 2>/dev/null)
          echo "Patch applied."

      - name: Build release binaries
        run: |
          cargo build ${{ matrix.features }} --release --bin zero-browser --bin zero-renderer --target ${{ matrix.target }}
          cargo build --release --bin zero-compositor --target ${{ matrix.target }}

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "::warning::MACOS_CERTIFICATE is not configured; the app will use an ad-hoc signature."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/zero-browser-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Create output directory
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zero-browser${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-renderer${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-compositor${{ matrix.ext }} dist/

      - name: Build macOS app archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # package-macos.sh 要求 YY.M.D 格式（CFBundleVersion 日期语义，
          # 与 scripts/package-macos.sh 默认及产品版本推导一致）；
          # Cargo.toml workspace 版本（0.1.0）不满足该格式
          VERSION="$(date +%y.%-m.%-d)"
          args=(
            --browser "target/${{ matrix.target }}/release/zero-browser"
            --renderer "target/${{ matrix.target }}/release/zero-renderer"
            --compositor "target/${{ matrix.target }}/release/zero-compositor"
            --output-dir package
            --version "$VERSION"
            --archive "dist/${{ matrix.artifact }}.zip"
          )
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            args+=(--sign-identity "$MACOS_SIGN_IDENTITY")
          fi
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            args+=(--notarize)
          else
            echo "::warning::macOS archive is not notarized; configure Developer ID and Apple notary secrets to avoid Gatekeeper prompts."
          fi
          scripts/package-macos.sh "${args[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ matrix.artifact }}
          path: dist/
          retention-days: 7

  release:
    name: Publish weekly release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Compute weekly tag (UTC date)
        id: tag
        shell: bash
        run: echo "name=weekly-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: weekly-*
          path: artifacts/

      - name: Repackage each platform as a zip
        shell: bash
        run: |
          set -e
          mkdir -p release
          for dir in artifacts/weekly-*/; do
            # artifact name is `weekly-<platform>`; strip the `weekly-` prefix
            # so the asset name matches the body text (the release itself is
            # already named "Weekly Build ...").
            name=$(basename "$dir" | sed 's/^weekly-//')
            packaged_zip="$dir/${name}.zip"
            if [[ -f "$packaged_zip" ]]; then
              cp "$packaged_zip" "release/${name}.zip"
            else
              (cd "$dir" && zip -r "../../release/${name}.zip" .)
            fi
          done
          echo "--- release/ ---"
          ls -la release/

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Create weekly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Weekly Build ${{ steps.tag.outputs.name }}
          body: |
            Automated weekly build of `main` (${{ github.sha }}).

            macOS zips contain `ZeroBrowser.app`. Linux and Windows zips contain
            `zero-browser`, `zero-renderer`, and `zero-compositor`; keep those
            executables in the same directory after extracting.

            V8 builds carry a `-v8` suffix, QuickJS builds a `-quickjs` suffix.
            Pick the zip matching your platform and engine:
            - `zero-browser-linux-x86_64-v8.zip` — Linux x86_64 (V8)
            - `zero-browser-linux-x86_64-quickjs.zip` — Linux x86_64 (QuickJS)
            - `zero-browser-linux-aarch64-v8.zip` — Linux ARM64 (V8)
            - `zero-browser-linux-aarch64-quickjs.zip` — Linux ARM64 (QuickJS)
            - `zero-browser-macos-x86_64-v8.zip` — macOS Intel, V8 (`ZeroBrowser.app`)
            - `zero-browser-macos-x86_64-quickjs.zip` — macOS Intel, QuickJS (`ZeroBrowser.app`)
            - `zero-browser-macos-aarch64-v8.zip` — macOS Apple Silicon, V8 (`ZeroBrowser.app`)
            - `zero-browser-macos-aarch64-quickjs.zip` — macOS Apple Silicon, QuickJS (`ZeroBrowser.app`)
            - `zero-browser-windows-x86_64-v8.zip` — Windows x86_64 (V8)
            - `zero-browser-windows-x86_64-quickjs.zip` — Windows x86_64 (QuickJS)
            - `zero-browser-windows-aarch64-quickjs.zip` — Windows ARM64 (QuickJS; may fail due to upstream freetype-sys issue)

            See `SHA256SUMS.txt` for checksums.
          prerelease: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt

  # WPT 趋势基线（调研 P2）：每周记录上游 reftest 绝对数 →
  # docs/goal/rendering-compat/evidence/wpt-trends/trend.csv 并提交回 main。
  # 口径：同源绝对数（自一致性参考，非达标依据；oracle 口径需本地 oracle-shots）。
  reftest-trend:
    needs: changes
    # schedule：有新 commit 才跑；dispatch：按 inputs 选择（仅 trend 时跳过 changes 门禁）
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.run_reftest_trend)
      || (github.event_name == 'schedule' && needs.changes.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Fetch wpt-data
        run: make fetch-wpt-data

      - name: Build zero-wpt-runner (release)
        run: cargo build --release --bin zero-wpt-runner

      - name: Record WPT trend (upstream absolute counts)
        run: bash scripts/record-wpt-trend.sh
        continue-on-error: true

      - name: Upload trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-trend
          path: docs/goal/rendering-compat/evidence/wpt-trends/
          retention-days: 14

      - name: Commit trend data back to main
        if: success()
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/goal/rendering-compat/evidence/wpt-trends/
          if git diff --cached --quiet; then
            echo "No trend changes to commit."
          else
            git commit -m "chore(wpt): 更新 WPT 趋势基线（绝对数，weekly cron）"
            # 全量 reftest 耗时 ~11 分钟，期间远端 main 可能有并发提交
            # （第三次验证暴露：push 被拒 fetch first）——rebase 后重推
            # 冲突容忍：基线/趋势为追加式数据，冲突时取远端（权威版本）；
            # 本地本次测量经下一轮 auto-tighten 继续收敛
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Trend data committed and pushed."
          fi

  # 性能门禁 + 趋势（docs/specs/performance-and-resource-budget.md）：
  # 每周在 ubuntu-latest（与基线同一 runner 类）真实测量 + 门禁比较 + 趋势回写 + auto-tighten。
  # 门禁失败 = 本 job 红（周报可见）；趋势仍继续记录（continue-on-error）。
  benchmark-trend:
    needs: changes
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.run_benchmark_trend)
      || (github.event_name == 'schedule' && needs.changes.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Build zero-wpt-runner (release)
        run: cargo build --release --bin zero-wpt-runner

      - name: Run benchmarks and gate
        run: |
          bash scripts/bench-report.sh
          bash scripts/perf-gate.sh

      - name: Record benchmark trend (auto-tighten)
        run: bash scripts/record-bench-trend.sh --auto-tighten
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-trend
          path: |
            docs/perf/
            tests/benchmarks/results/
          retention-days: 14

      # always() 而非 success()：门禁 FAIL 时（job 红）仍把趋势 + auto-tighten 结果
      # 提交回 main——回归证据进 git 历史；无变更守卫保证早期步骤失败时不产生空提交。
      - name: Commit benchmark trend back to main
        if: always()
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/perf/
          if git diff --cached --quiet; then
            echo "No benchmark trend changes to commit."
          else
            git commit -m "chore(perf): 更新性能基准趋势与基线（weekly cron）"
            # 测量耗时 ~15 分钟，期间远端 main 可能有并发提交——rebase 后重推
            # 冲突容忍：基线/趋势为追加式数据，冲突时取远端（权威版本）；
            # 本地本次测量经下一轮 auto-tighten 继续收敛
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Benchmark trend data committed and pushed."
          fi

  # 月度工程报告（scripts/generate-monthly-report.sh）：每月 1 日自动生成上月报告
  #（WPT 趋势 + 性能趋势 + 提交统计）并提交回 main。纯脚本无构建依赖。
  monthly-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate monthly report (previous month)
        run: bash scripts/generate-monthly-report.sh

      - name: Commit monthly report back to main
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/monthly/
          if git diff --cached --quiet; then
            echo "No monthly report changes."
          else
            git commit -m "chore(monthly): 更新月度工程报告（WPT + 性能趋势）"
            # 冲突容忍：基线/趋势为追加式数据，冲突时取远端（权威版本）；
            # 本地本次测量经下一轮 auto-tighten 继续收敛
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Monthly report committed and pushed."
          fi
