name: Weekly Build

on:
  schedule:
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      # A1：dispatch 时可选只跑 reftest-trend（避免 6 平台构建矩阵）
      run_reftest_trend:
        description: 'Run reftest-trend job only (skip build matrix)'
        type: boolean
        default: false
      # 性能门禁：dispatch 时可选只跑 benchmark-trend（真实测量 + 门禁 + 趋势回写）
      run_benchmark_trend:
        description: 'Run benchmark-trend job only (skip build matrix)'
        type: boolean
        default: false
      # wpt.fyi 差距快照：dispatch 时可选只跑 wptfyi-gap（构建 runner + 三套件
      # + 拉 wpt.fyi + 快照回写，约 20 分钟）
      run_wptfyi_gap:
        description: 'Run wptfyi-gap job only (skip build matrix)'
        type: boolean
        default: false
      # wpt.fyi 全量对账：dispatch 时可选只跑 wptfyi-coverage（matrix 分片跑
      # 全部已导入套件 + 拉 wpt.fyi 全量清单 + coverage 快照回写）
      run_wptfyi_coverage:
        description: 'Run wptfyi-coverage jobs only (skip build matrix)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new commits since last successful weekly build
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_build', 'true');
              return;
            }

            const {owner, repo} = context.repo;
            const currentSha = context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'weekly.yml',
              branch: 'main',
              status: 'success',
              event: 'schedule',
              per_page: 100,
            });
            const previous = runs.find((run) => run.id !== context.runId);
            core.setOutput('should_build', previous?.head_sha === currentSha ? 'false' : 'true');

  build:
    needs: changes
    # A1：dispatch「仅 trend」模式跳过 6 平台构建矩阵
    if: >
      needs.changes.outputs.should_build == 'true'
      && !(github.event_name == 'workflow_dispatch'
           && (inputs.run_reftest_trend || inputs.run_benchmark_trend
               || inputs.run_wptfyi_gap || inputs.run_wptfyi_coverage))
    name: Build ${{ matrix.target }} (${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    # windows-aarch64: freetype-sys NEON 汇编问题（已知上游 bug），不阻塞 weekly
    continue-on-error: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每种平台出 v8 与 quickjs 两个引擎的产物；windows-aarch64 无 v8（rusty_v8 不发布该目标原生库），只有 quickjs
          # browser_features：zero-browser 默认 feature 无引擎（default = ["windows-console"]），
          # 必须显式点亮引擎，否则产物里没有 JS。不能沿用 --no-default-features
          # （会丢掉 windows-console）。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zero-browser-linux-x86_64-v8
            engine: v8
            ext: ''
            features: ''
            browser_features: '--features v8'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zero-browser-linux-x86_64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
            browser_features: '--features quickjs'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zero-browser-linux-aarch64-v8
            engine: v8
            ext: ''
            features: ''
            browser_features: '--features v8'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zero-browser-linux-aarch64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
            browser_features: '--features quickjs'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zero-browser-macos-x86_64-v8
            engine: v8
            ext: ''
            features: ''
            browser_features: '--features v8'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zero-browser-macos-x86_64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
            browser_features: '--features quickjs'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zero-browser-macos-aarch64-v8
            engine: v8
            ext: ''
            features: ''
            browser_features: '--features v8'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zero-browser-macos-aarch64-quickjs
            engine: quickjs
            ext: ''
            features: '--no-default-features --features quickjs'
            browser_features: '--features quickjs'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zero-browser-windows-x86_64-v8
            engine: v8
            ext: '.exe'
            features: ''
            browser_features: '--features v8'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zero-browser-windows-x86_64-quickjs
            engine: quickjs
            ext: '.exe'
            features: '--no-default-features --features quickjs'
            browser_features: '--features quickjs'
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: zero-browser-windows-aarch64-quickjs
            engine: quickjs
            ext: '.exe'
            features: '--no-default-features --features quickjs'
            browser_features: '--features quickjs'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine rusty_v8 version
        if: matrix.engine == 'v8'
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        if: matrix.engine == 'v8'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zero-web/rusty_v8
            ~/Library/Caches/zero-web/rusty_v8
            ~/AppData/Local/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.engine }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.engine }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        if: runner.os != 'Windows' && matrix.engine == 'v8'
        shell: bash
        run: RUSTY_V8_TARGET=${{ matrix.target }} bash scripts/download-rusty-v8.sh

      - name: Configure rusty_v8 archive on Windows
        if: runner.os == 'Windows' && matrix.engine == 'v8'
        shell: bash
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/rusty_v8_release_${{ matrix.target }}.lib.gz" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=advapi32.lib" >> "$GITHUB_ENV"

      - name: Install zlib via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.target }}' -match 'aarch64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
          Write-Host "Installing zlib:$triplet via vcpkg..."
          vcpkg install zlib --triplet $triplet
          $vcpkgInclude = "C:\vcpkg\installed\$triplet\include"
          $vcpkgLib = "C:\vcpkg\installed\$triplet\lib"
          "CFLAGS=-I$vcpkgInclude" >> $env:GITHUB_ENV
          "INCLUDE=$vcpkgInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$vcpkgLib;$env:LIB" >> $env:GITHUB_ENV
          Write-Host "vcpkg zlib installed, CFLAGS/INCLUDE/LIB set to $vcpkgInclude"

      - name: Configure MSVC include paths for clang/bindgen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" }
          Write-Host "VS installation: $vsPath"
          $msvcVer = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdkVer = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($msvcVer -and $sdkVer) {
            $msvcInc = "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\include"
            $sdkUcrt = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\ucrt"
            $sdkUm = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\um"
            $sdkShared = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\shared"
            $clangArgs = "-isystem`"$msvcInc`" -isystem`"$sdkUcrt`" -isystem`"$sdkUm`" -isystem`"$sdkShared`""
            "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs" >> $env:GITHUB_ENV
            Write-Host "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs"
            # windows-aarch64：cc-rs 探测不到 cl.exe 时回退 clang 编译 C 依赖（ring 等），
            # 而 clang 不会自动发现 MSVC/UCRT 头（'assert.h' file not found）。CPATH 是
            # clang GNU 驱动原生 include 搜索路径（Windows 下 `;` 分隔，逐项取字面量，
            # 不加引号）；cl.exe 不读取 CPATH，不影响 windows-x86_64 编译路径。
            if ('${{ matrix.target }}' -match 'aarch64') {
              "CPATH=$msvcInc;$sdkUcrt;$sdkUm;$sdkShared" >> $env:GITHUB_ENV
              Write-Host "CPATH=$msvcInc;$sdkUcrt;$sdkUm;$sdkShared"
            }
          } else {
            Write-Host "WARNING: could not locate MSVC/SDK include paths"
          }

      - name: Patch freetype-sys filter_neon.S for MSVC (windows-aarch64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -e
          cargo fetch --target ${{ matrix.target }}
          CRATE_FILE=$(find "$CARGO_HOME/registry/cache" -name "freetype-sys-0.23.0.crate" 2>/dev/null | head -1)
          if [ -z "$CRATE_FILE" ]; then
            echo "ERROR: freetype-sys-0.23.0.crate not found in cache"
            exit 1
          fi
          echo "Patching $CRATE_FILE: removing filter_neon.S from build.rs"
          MSYS2_CRATE=$(cygpath -u "$CRATE_FILE")
          TMPDIR=$(mktemp -d)
          tar xzf "$MSYS2_CRATE" -C "$TMPDIR"
          find "$TMPDIR" -name "build.rs" -exec sed -i '/filter_neon\.S/d' {} \;
          (cd "$TMPDIR/freetype-sys-0.23.0" && rm -f .cargo-checksum.json && find . -type f -exec sha256sum {} \; | sort -k 2 > .cargo-checksum.json)
          tar czf "$MSYS2_CRATE" -C "$TMPDIR" freetype-sys-0.23.0
          rm -rf "$TMPDIR"
          rm -rf $(find "$CARGO_HOME/registry/src" -name "freetype-sys-0.23.0" -type d 2>/dev/null)
          echo "Patch applied."

      # 三条命令都必须带 -p：workspace 根的 --bin 构建会做全成员 feature 统一
      # 解析——wpt-runner 的 default = ["v8"] 点亮 zero-engine/v8，把 v8 crate 拖进
      # 构建图，quickjs 臂因没跑 rusty_v8 预下载而在 v8 build.rs 处 panic
      # （2026-08-15 起连续失败；仅给 browser/renderer 加显式 feature 不够，
      # 37604698775 实证 v8 仍经统一解析混入）。-p 把解析范围限定到目标包。
      - name: Build release binaries
        run: |
          cargo build -p zero-browser ${{ matrix.browser_features }} --release --bin zero-browser --target ${{ matrix.target }}
          cargo build -p zero-renderer ${{ matrix.features }} --release --bin zero-renderer --target ${{ matrix.target }}
          cargo build -p zero-compositor -p zero-image-decoder --release --target ${{ matrix.target }}

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "::warning::MACOS_CERTIFICATE is not configured; the app will use an ad-hoc signature."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/zero-browser-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Create output directory
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zero-browser${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-renderer${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-compositor${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/zero-image-decoder${{ matrix.ext }} dist/

      - name: Build macOS app archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # package-macos.sh 要求 YY.M.D 格式（CFBundleVersion 日期语义，
          # 与 scripts/package-macos.sh 默认及产品版本推导一致）；
          # Cargo.toml workspace 版本（0.1.0）不满足该格式
          VERSION="$(date +%y.%-m.%-d)"
          args=(
            --browser "target/${{ matrix.target }}/release/zero-browser"
            --renderer "target/${{ matrix.target }}/release/zero-renderer"
            --compositor "target/${{ matrix.target }}/release/zero-compositor"
            --decoder "target/${{ matrix.target }}/release/zero-image-decoder"
            --output-dir package
            --version "$VERSION"
            --archive "dist/${{ matrix.artifact }}.zip"
          )
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            args+=(--sign-identity "$MACOS_SIGN_IDENTITY")
          fi
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            args+=(--notarize)
          else
            echo "::warning::macOS archive is not notarized; configure Developer ID and Apple notary secrets to avoid Gatekeeper prompts."
          fi
          scripts/package-macos.sh "${args[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ matrix.artifact }}
          path: dist/
          retention-days: 7

  release:
    name: Publish weekly release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Compute weekly tag (UTC date)
        id: tag
        shell: bash
        run: echo "name=weekly-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: weekly-*
          path: artifacts/

      - name: Repackage each platform as a zip
        shell: bash
        run: |
          set -e
          mkdir -p release
          for dir in artifacts/weekly-*/; do
            # artifact name is `weekly-<platform>`; strip the `weekly-` prefix
            # so the asset name matches the body text (the release itself is
            # already named "Weekly Build ...").
            name=$(basename "$dir" | sed 's/^weekly-//')
            packaged_zip="$dir/${name}.zip"
            if [[ -f "$packaged_zip" ]]; then
              cp "$packaged_zip" "release/${name}.zip"
            else
              (cd "$dir" && zip -r "../../release/${name}.zip" .)
            fi
          done
          echo "--- release/ ---"
          ls -la release/

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Create weekly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Weekly Build ${{ steps.tag.outputs.name }}
          body: |
            Automated weekly build of `main` (${{ github.sha }}).

            macOS zips contain `ZeroBrowser.app`. Linux and Windows zips contain
            `zero-browser`, `zero-renderer`, and `zero-compositor`; keep those
            executables in the same directory after extracting.

            V8 builds carry a `-v8` suffix, QuickJS builds a `-quickjs` suffix.
            Pick the zip matching your platform and engine:
            - `zero-browser-linux-x86_64-v8.zip` — Linux x86_64 (V8)
            - `zero-browser-linux-x86_64-quickjs.zip` — Linux x86_64 (QuickJS)
            - `zero-browser-linux-aarch64-v8.zip` — Linux ARM64 (V8)
            - `zero-browser-linux-aarch64-quickjs.zip` — Linux ARM64 (QuickJS)
            - `zero-browser-macos-x86_64-v8.zip` — macOS Intel, V8 (`ZeroBrowser.app`)
            - `zero-browser-macos-x86_64-quickjs.zip` — macOS Intel, QuickJS (`ZeroBrowser.app`)
            - `zero-browser-macos-aarch64-v8.zip` — macOS Apple Silicon, V8 (`ZeroBrowser.app`)
            - `zero-browser-macos-aarch64-quickjs.zip` — macOS Apple Silicon, QuickJS (`ZeroBrowser.app`)
            - `zero-browser-windows-x86_64-v8.zip` — Windows x86_64 (V8)
            - `zero-browser-windows-x86_64-quickjs.zip` — Windows x86_64 (QuickJS)
            - `zero-browser-windows-aarch64-quickjs.zip` — Windows ARM64 (QuickJS; may fail due to upstream freetype-sys issue)

            See `SHA256SUMS.txt` for checksums.
          prerelease: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt

  # WPT 趋势基线（调研 P2）：每周记录上游 reftest 绝对数 →
  # docs/goal/rendering-compat/evidence/wpt-trends/trend.csv 并提交回 main。
  # 口径：同源绝对数（自一致性参考，非达标依据；oracle 口径需本地 oracle-shots）。
  reftest-trend:
    needs: changes
    # schedule：有新 commit 才跑；dispatch：按 inputs 选择（仅 trend 时跳过 changes 门禁）
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.run_reftest_trend)
      || (github.event_name == 'schedule' && needs.changes.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Fetch wpt-data
        run: make fetch-wpt-data

      - name: Build zero-wpt-runner (release)
        run: cargo build --release --bin zero-wpt-runner

      - name: Record WPT trend (upstream absolute counts)
        run: bash scripts/record-wpt-trend.sh
        continue-on-error: true

      - name: Upload trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-trend
          path: docs/goal/rendering-compat/evidence/wpt-trends/
          retention-days: 14

      - name: Commit trend data back to main
        if: success()
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/goal/rendering-compat/evidence/wpt-trends/
          if git diff --cached --quiet; then
            echo "No trend changes to commit."
          else
            git commit -m "chore(wpt): 更新 WPT 趋势基线（绝对数，weekly cron）"
            # 全量 reftest 耗时 ~11 分钟，期间远端 main 可能有并发提交
            # （第三次验证暴露：push 被拒 fetch first）——rebase 后重推
            # 冲突容忍：基线/趋势为追加式数据，冲突时取远端（权威版本）；
            # 本地本次测量经下一轮 auto-tighten 继续收敛
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Trend data committed and pushed."
          fi

  # 性能门禁 + 趋势（docs/specs/performance-and-resource-budget.md）：
  # 每周在 ubuntu-latest（与基线同一 runner 类）真实测量 + 门禁比较 + 趋势回写 + auto-tighten。
  # 门禁失败 = 本 job 红（周报可见）；趋势仍继续记录（continue-on-error）。
  benchmark-trend:
    needs: changes
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.run_benchmark_trend)
      || (github.event_name == 'schedule' && needs.changes.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Build zero-wpt-runner (release)
        run: cargo build --release --bin zero-wpt-runner

      - name: Run benchmarks and gate
        run: |
          bash scripts/bench-report.sh
          bash scripts/perf-gate.sh

      - name: Record benchmark trend (auto-tighten)
        run: bash scripts/record-bench-trend.sh --auto-tighten
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-trend
          path: |
            docs/perf/
            tests/benchmarks/results/
          retention-days: 14

      # always() 而非 success()：门禁 FAIL 时（job 红）仍把趋势 + auto-tighten 结果
      # 提交回 main——回归证据进 git 历史；无变更守卫保证早期步骤失败时不产生空提交。
      - name: Commit benchmark trend back to main
        if: always()
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/perf/
          if git diff --cached --quiet; then
            echo "No benchmark trend changes to commit."
          else
            git commit -m "chore(perf): 更新性能基准趋势与基线（weekly cron）"
            # 测量耗时 ~15 分钟，期间远端 main 可能有并发提交——rebase 后重推
            # 冲突容忍：基线/趋势为追加式数据，冲突时取远端（权威版本）；
            # 本地本次测量经下一轮 auto-tighten 继续收敛
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Benchmark trend data committed and pushed."
          fi

  # wpt.fyi 三浏览器差距快照（docs/compat/wptfyi-gap-analysis.md）：
  # 每周把 ZeroWeb 三套件成绩与 chrome/firefox/safari aligned stable 对比，
  # 快照（md+json）追加提交回 docs/compat/wptfyi/——文档与网站统计口径的
  # 数据源。与 reftest-trend 的差异：wpt.fyi run 每日滚动，数据面刷新不依赖
  # 代码变化，schedule 恒跑（不走 changes 门禁）；快照为追加式数据，
  # 旧快照保留即趋势史。
  wptfyi-gap:
    if: >
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.run_wptfyi_gap)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Build zero-wpt-runner and test-guard
        run: |
          cargo build --release --bin zero-wpt-runner
          make target/test-guard

      # GITHUB_TOKEN 给 goals/lib.sh 的 API 列目录认证——未认证 60 req/h 对
      # CI 共享出口 IP 基本必 403，goals 脚本对限流优雅降级（跳过目录不报错），
      # 会静默产出残缺语料（2026-10-26 首跑实证：compression 0 案、cookies 缺
      # 子目录）。fetch-wpt-html-testharness 先引导共享 resources/testharness.js
      # ——goals/lib.sh 体系不拉 resources，全新 checkout 缺它会让每案页面
      # 加载即失败（webstorage 25 案全 0/1 假差距）。
      - name: Fetch suite corpora
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make fetch-wpt-html-testharness
          make fetch-wpt-compression fetch-wpt-cookies fetch-wpt-webstorage

      # 有失败用例时 runner 退出码非 0 属预期（gap 报告就是要看差距）；
      # 但 JSON 必须落盘，空输出说明 runner 崩了，job 应当红。
      - name: Run suites (test-guard wrapped, JSON captured)
        shell: bash
        run: |
          mkdir -p /tmp/zw-results
          for suite in compression cookies webstorage; do
            ./target/test-guard --per-proc-mem 4 --total-mem 8 --time-limit 900 -- \
              ./target/release/zero-wpt-runner "testharness-$suite" --json \
              > "/tmp/zw-results/testharness-$suite.json" \
              || echo "::warning::$suite 退出码非 0（存在失败用例属预期）"
            test -s "/tmp/zw-results/testharness-$suite.json" \
              || { echo "::error::$suite 无 JSON 输出"; exit 1; }
          done

      - name: Fetch wpt.fyi aligned stable and build gap snapshot
        run: |
          python3 tests/wpt-runner/scripts/wptfyi_gap.py fetch
          python3 tests/wpt-runner/scripts/wptfyi_gap.py gap \
            --results /tmp/zw-results \
            --out "docs/compat/wptfyi/gap-$(date -u +%F).md"
          # 快照是持久数据：可疑条目（引导失败伪 case/空 subtests/同名重复）
          # 说明套件输出不可信——拒绝发布，宁缺毋滥（首跑事故实证）。
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); n=sum(s["skipped_suspicious"] for s in d["suites"].values()); sys.exit(f"{n} 条可疑条目，套件输出异常，拒绝发布快照") if n else None' \
            "docs/compat/wptfyi/gap-$(date -u +%F).json"

      - name: Upload gap snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wptfyi-gap
          path: docs/compat/wptfyi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit gap snapshot back to main
        if: success()
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/compat/wptfyi/
          if git diff --cached --quiet; then
            echo "No gap snapshot changes to commit."
          else
            git commit -m "chore(wpt): 更新 wpt.fyi 三浏览器差距快照（weekly cron）"
            # 冲突容忍：快照为追加式数据，冲突时取远端（权威版本）
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Gap snapshot committed and pushed."
          fi

  # 分片自动发现：runner 源码 match 臂提取全部 testharness-* 套件，diff
  # ci-shards.yml 手调分片，剩余套件按 ci-catchall.tsv（fetch 目标覆写）
  # 自动打包成 catch-all 分片追加进 matrix——新 runner 套件零 CI 编辑即
  # 入全量对账。纯 Python 标准库读源码，无需构建。
  discover-shards:
    if: >
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.run_wptfyi_coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards_json: ${{ steps.discover.outputs.shards_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: discover
        run: |
          python3 tests/wpt-runner/scripts/ci_discover_shards.py \
            --runner-src tests/wpt-runner/src/main.rs \
            --tuned tests/wpt-runner/ci-shards.yml \
            --registry tests/wpt-runner/ci-catchall.tsv \
            --out-shards /tmp/shards.json
          echo "shards_json=$(cat /tmp/shards.json)" >> "$GITHUB_OUTPUT"

  # wpt.fyi 全量对账（docs/compat/wptfyi-gap-analysis.md「全量对账」节）：
  # matrix 分片跑全部已导入 testharness 套件；未跑的测试在三家并集全量清单上
  # 记 0。aggregate 合并产物 + 拉 wpt.fyi 清单，产出 coverage-<日期>.md/.json
  # 快照提交回 docs/compat/wptfyi/——网站「全量 WPT 通过率」与缺口地图数据源。
  # 语料坑同 wptfyi-gap（GITHUB_TOKEN 认证 + resources 引导）；clipboard/
  # fullscreen 等套件需要 X display，装 xvfb 提供。分片清单由 discover-shards
  # 动态生成（手调 + catch-all），调预算/组合改 ci-shards.yml，不改这里。
  wptfyi-coverage:
    if: >
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.run_wptfyi_coverage)
    needs: discover-shards
    runs-on: ubuntu-latest
    # 150 = sec 分片实跑预算（run 40505731836 实证 csp+mixed+secure ≈76min
    # 计时器外）+ build/fetch ~15min + 余量；time_limit 为 per-suite 限时，
    # job timeout 才是分片硬顶。css-face 三分片语料深挖体量大（每片 ~5–7k
    # 文件顺序拉取 1–1.5h），经 job_timeout 字段单独放宽。
    # Job 级硬顶 360：GH 对动态矩阵（needs.outputs fromJSON）无法求值依赖
    # matrix 上下文的 timeout-minutes——表达式存在即整个矩阵零展开、无报错
    # 直接红（run 41401305431 沙箱二分定谳）。故取静态 360（≥ 手调分片最大
    # job_timeout 350）；分片真实预算仍由 test-guard per-suite time_limit 与
    # ci-shards.yml 各分片 job_timeout 记录值约束。
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # job 名含连字符必须用括号语法取属性（点号不合法 → 矩阵零展开）。
        shard: ${{ fromJSON(needs['discover-shards'].outputs.shards_json) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install xvfb (clipboard/fullscreen 等套件需要 X display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Build zero-wpt-runner and test-guard
        run: |
          cargo build --release --bin zero-wpt-runner
          make target/test-guard

      # 与 wptfyi-gap 相同的语料坑：GITHUB_TOKEN 认证列目录（未认证 60 req/h
      # 静默降级产出残缺语料）；fetch-wpt-html-testharness 引导共享 resources。
      - name: Fetch suite corpora
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make fetch-wpt-html-testharness
          # discoverer 契约「跑不动的面该面记 0（与未跑同态）」：catch-all 套件
          # fetch 目标缺失/失败只废本套件面，不连带同分片兄弟套件（run
          # 42498433483 catch-all-7 shadow-dom 语料依赖链断裂曾连带 storage
          # 面丢失）。共享 harness 引导（上一行）保持致命。
          for t in ${{ matrix.shard.fetch }}; do
            make "$t" || echo "::warning::fetch $t 失败，套件面记 0（与未跑同态）"
          done
          for s in ${{ matrix.shard.fetch_scripts }}; do
            bash "tests/wpt-runner/scripts/$s"
          done

      # SW core 的语料 = tier-a + 全部 wave fetch（Makefile 55+ 目标，循环拉）。
      - name: Fetch service workers corpora (tier-a + all waves)
        if: matrix.shard.name == 'service-workers'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make fetch-wpt-service-workers-tier-a
          for w in $(grep -E '^fetch-wpt-service-workers' Makefile | cut -d: -f1); do
            make "$w"
          done

      # 有失败用例时 runner 退出码非 0 属预期（对账就是要看差距）；JSON 空
      # 输出说明 runner 崩了或语料残缺，shard 应当红。
      - name: Run suites (test-guard wrapped, JSON captured)
        shell: bash
        env:
          # runner 看门狗缺省 90s（testharness.rs script_timeout_ms）；大页面
          # 通道按 shard 提额（script_timeout 字段），未设 shard 取 90000 与
          # runner 缺省相同——零行为变化。缺提额时 encode-form 页（每 variant
          # ~1000 async_test）语料修好后仍会成批 Timeout 假失败。
          ZW_SCRIPT_TIMEOUT_MS: ${{ matrix.shard.script_timeout || 90000 }}
          # 单案 wall-clock 预算缺省 30s（testharness.rs CORPUS_CASE_TIMEOUT）；
          # form 通道按 shard 提额（case_timeout 字段），未设 shard 取 30 与
          # runner 缺省相同——零行为变化。CI form 条目 ~60–100s（本地 3–4×），
          # 缺提额会复现 run 41037174647 的整条合成 Timeout。
          ZW_CORPUS_CASE_TIMEOUT_SECS: ${{ matrix.shard.case_timeout || 30 }}
        run: |
          # filter：runner 位置参数（路径子串，同套件按族拆分片时用，如
          # form-encode-jp）；空值展开为无参，既有分片零变化。result_tag：
          # 同套件多分片的 JSON 文件名后缀——aggregate 产物平铺下载
          # （merge-multiple: true），同名文件会互相覆盖，同套件多片必须互异。
          filter="${{ matrix.shard.filter }}"
          tag="${{ matrix.shard.result_tag }}"
          mkdir -p /tmp/zw-results
          # 无 JSON 输出（runner 崩/语料残缺）仍让分片红，但只记账不中断循环
          # ——兄弟套件照跑，红面不扩大（与 fetch 步容错同款契约）。
          rc=0
          for s in ${{ matrix.shard.suites }}; do
            ./target/test-guard --per-proc-mem 4 --total-mem 8 --time-limit ${{ matrix.shard.time_limit }} -- \
              ./target/release/zero-wpt-runner "testharness-$s" $filter --json \
              > "/tmp/zw-results/testharness-$s${tag:+-$tag}.json" \
              || echo "::warning::testharness-$s 退出码非 0（存在失败用例属预期）"
            test -s "/tmp/zw-results/testharness-$s${tag:+-$tag}.json" \
              || { echo "::error::testharness-$s 无 JSON 输出"; rc=1; }
          done
          exit $rc

      - name: Upload results shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zw-results-${{ matrix.shard.name }}
          path: /tmp/zw-results
          if-no-files-found: error
          retention-days: 3

  # 合并各分片结果 → 拉 wpt.fyi 三家 aligned stable 清单 → 生成全量对账快照
  # → 提交回 main。纯 Python 标准库，无需构建环境。
  wptfyi-coverage-aggregate:
    needs: wptfyi-coverage
    # 个别分片红（如某 catch-all 套件语料依赖链断裂）不吞快照：未跑的面按
    # 分母设计记 0（与未跑同态）；分片红态在矩阵 job 结论上保持可见。
    # 取消仍跳过（success/failure 均不覆盖 cancelled）。
    if: >-
      (github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.run_wptfyi_coverage))
      && (success() || failure())
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Merge result shards
        uses: actions/download-artifact@v7
        with:
          pattern: zw-results-*
          path: /tmp/zw-results
          merge-multiple: true

      - name: Fetch wpt.fyi aligned stable and build coverage snapshot
        run: |
          python3 tests/wpt-runner/scripts/wptfyi_gap.py fetch
          python3 tests/wpt-runner/scripts/wptfyi_gap.py coverage \
            --results /tmp/zw-results \
            --out "docs/compat/wptfyi/coverage-$(date -u +%F).md"

      - name: Upload coverage snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wptfyi-coverage
          path: docs/compat/wptfyi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit coverage snapshot back to main
        if: success()
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/compat/wptfyi/
          if git diff --cached --quiet; then
            echo "No coverage snapshot changes to commit."
          else
            git commit -m "chore(wpt): 更新 wpt.fyi 全量对账快照（weekly cron）"
            # 冲突容忍：快照为追加式数据，冲突时取远端（权威版本）
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Coverage snapshot committed and pushed."
          fi

  # 月度工程报告（scripts/generate-monthly-report.sh）：每月 1 日自动生成上月报告
  #（WPT 趋势 + 性能趋势 + 提交统计）并提交回 main。纯脚本无构建依赖。
  monthly-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate monthly report (previous month)
        run: bash scripts/generate-monthly-report.sh

      - name: Commit monthly report back to main
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/monthly/
          if git diff --cached --quiet; then
            echo "No monthly report changes."
          else
            git commit -m "chore(monthly): 更新月度工程报告（WPT + 性能趋势）"
            # 冲突容忍：基线/趋势为追加式数据，冲突时取远端（权威版本）；
            # 本地本次测量经下一轮 auto-tighten 继续收敛
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Monthly report committed and pushed."
          fi
