name: Weekly Build

on:
  schedule:
    - cron: '0 10 * * 6'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new commits since last successful weekly build
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_build', 'true');
              return;
            }

            const {owner, repo} = context.repo;
            const currentSha = context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'weekly.yml',
              branch: 'main',
              status: 'success',
              event: 'schedule',
              per_page: 100,
            });
            const previous = runs.find((run) => run.id !== context.runId);
            core.setOutput('should_build', previous?.head_sha === currentSha ? 'false' : 'true');

  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # windows-aarch64: freetype-sys NEON 汇编问题（已知上游 bug），不阻塞 weekly
    continue-on-error: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zero-browser-linux-x86_64
            ext: ''
            features: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zero-browser-linux-aarch64
            ext: ''
            features: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zero-browser-macos-x86_64
            ext: ''
            features: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zero-browser-macos-aarch64
            ext: ''
            features: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zero-browser-windows-x86_64
            ext: '.exe'
            features: ''
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: zero-browser-windows-aarch64
            ext: '.exe'
            features: '--no-default-features --features quickjs'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"rusty_v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zero-web/rusty_v8
            ~/Library/Caches/zero-web/rusty_v8
            ~/AppData/Local/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        if: runner.os != 'Windows' && matrix.features == ''
        shell: bash
        run: RUSTY_V8_TARGET=${{ matrix.target }} bash scripts/download-rusty-v8.sh

      - name: Configure rusty_v8 archive on Windows
        if: runner.os == 'Windows' && matrix.features == ''
        shell: bash
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/rusty_v8_release_${{ matrix.target }}.lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=advapi32.lib" >> "$GITHUB_ENV"

      - name: Install zlib via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.target }}' -match 'aarch64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
          Write-Host "Installing zlib:$triplet via vcpkg..."
          vcpkg install zlib --triplet $triplet
          $vcpkgInclude = "C:\vcpkg\installed\$triplet\include"
          $vcpkgLib = "C:\vcpkg\installed\$triplet\lib"
          "CFLAGS=-I$vcpkgInclude" >> $env:GITHUB_ENV
          "INCLUDE=$vcpkgInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$vcpkgLib;$env:LIB" >> $env:GITHUB_ENV
          Write-Host "vcpkg zlib installed, CFLAGS/INCLUDE/LIB set to $vcpkgInclude"

      - name: Patch freetype-sys filter_neon.S for MSVC (windows-aarch64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -e
          cargo fetch --target ${{ matrix.target }}
          CRATE_FILE=$(find "$CARGO_HOME/registry/cache" -name "freetype-sys-0.23.0.crate" 2>/dev/null | head -1)
          if [ -z "$CRATE_FILE" ]; then
            echo "ERROR: freetype-sys-0.23.0.crate not found in cache"
            exit 1
          fi
          echo "Patching $CRATE_FILE: removing filter_neon.S from build.rs"
          MSYS2_CRATE=$(cygpath -u "$CRATE_FILE")
          TMPDIR=$(mktemp -d)
          tar xzf "$MSYS2_CRATE" -C "$TMPDIR"
          find "$TMPDIR" -name "build.rs" -exec sed -i '/filter_neon\.S/d' {} \;
          (cd "$TMPDIR/freetype-sys-0.23.0" && rm -f .cargo-checksum.json && find . -type f -exec sha256sum {} \; | sort -k 2 > .cargo-checksum.json)
          tar czf "$MSYS2_CRATE" -C "$TMPDIR" freetype-sys-0.23.0
          rm -rf "$TMPDIR"
          rm -rf $(find "$CARGO_HOME/registry/src" -name "freetype-sys-0.23.0" -type d 2>/dev/null)
          echo "Patch applied."

      - name: Build release binary
        run: cargo build ${{ matrix.features }} --release --bin zero-browser --target ${{ matrix.target }}

      - name: Create output directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zero-browser${{ matrix.ext }} dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ matrix.artifact }}
          path: dist/
          retention-days: 7
