name: CI

on:
  workflow_dispatch:
    inputs:
      run_release_builds:
        description: 'Also run release builds after checks and tests'
        type: boolean
        default: false
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || (github.event.review.state == 'approved' && github.event.review.author_association == 'OWNER')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            v8_runtime: true
            release_build: true
            features: ''
          - name: linux-x86_64-quickjs
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            v8_runtime: false
            release_build: false
            features: '--no-default-features --features quickjs'
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            v8_runtime: true
            release_build: true
            features: ''
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            v8_runtime: true
            release_build: true
            features: ''
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            v8_runtime: true
            release_build: true
            features: ''
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            v8_runtime: true
            release_build: true
            features: ''
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            v8_runtime: false
            release_build: false
            features: '--no-default-features --features quickjs'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"rusty_v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zero-web/rusty_v8
            ~/Library/Caches/zero-web/rusty_v8
            ~/AppData/Local/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - name: Download rusty_v8 archive
        if: runner.os != 'Windows' && matrix.v8_runtime != false
        shell: bash
        run: RUSTY_V8_TARGET=${{ matrix.target }} bash scripts/download-rusty-v8.sh

      - name: Configure rusty_v8 archive on Windows
        if: runner.os == 'Windows' && matrix.v8_runtime != false
        shell: bash
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/rusty_v8_release_${{ matrix.target }}.lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=advapi32.lib" >> "$GITHUB_ENV"

      - name: Install zlib via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.target }}' -match 'aarch64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
          Write-Host "Installing zlib:$triplet via vcpkg..."
          vcpkg install zlib --triplet $triplet
          Write-Host "vcpkg zlib installation complete"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace (V8-free targets only; V8 targets are fully checked by clippy)
        if: matrix.v8_runtime == false
        run: cargo check ${{ matrix.features }} --workspace --target ${{ matrix.target }}

      - name: Run clippy
        if: matrix.v8_runtime != false
        run: cargo clippy ${{ matrix.features }} --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run clippy without V8-backed targets
        if: matrix.v8_runtime == false
        shell: bash
        run: |
          cargo clippy ${{ matrix.features }} \
            -p zero-dom \
            -p zero-css-parser \
            -p zero-style-system \
            -p zero-layout-engine \
            -p zero-engine \
            -p zero-canvas \
            -p zero-host-runtime \
            -p zero-net \
            -p zero-security \
            -p zero-storage \
            -p zero-protocol \
            -p zero-wasm-sandbox \
            -p zero-page-runtime \
            -p zero-render-foundation \
            --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run core crate tests without V8
        if: matrix.v8_runtime != false
        timeout-minutes: 20
        shell: bash
        run: |
          cargo test ${{ matrix.features }} \
            -p zero-dom \
            -p zero-css-parser \
            -p zero-style-system \
            -p zero-layout-engine \
            -p zero-engine \
            -p zero-canvas \
            -p zero-host-runtime \
            -p zero-net \
            -p zero-security \
            -p zero-storage \
            -p zero-protocol \
            -p zero-wasm-sandbox \
            -p zero-page-runtime \
            --target ${{ matrix.target }} -- --test-threads=1

      - name: Run V8-backed core tests
        if: matrix.v8_runtime != false && runner.os != 'Windows'
        timeout-minutes: 20
        shell: bash
        run: |
          cargo test ${{ matrix.features }} \
            -p zero-script-sandbox \
            -p zero-webview \
            --target ${{ matrix.target }} -- --test-threads=1

      - name: Run app tests
        if: matrix.v8_runtime != false
        timeout-minutes: 40
        shell: bash
        run: |
          cargo test ${{ matrix.features }} \
            -p zero-browser \
            -p zero-renderer \
            -p zero-webview-demo \
            --target ${{ matrix.target }} -- --test-threads=1

      - name: Run integration and WPT runner tests
        if: matrix.v8_runtime != false
        timeout-minutes: 20
        shell: bash
        run: |
          RUST_BACKTRACE=1 cargo test ${{ matrix.features }} \
            -p zero-integration-tests \
            -p zero-wpt-runner \
            --target ${{ matrix.target }} -- --test-threads=1

      - name: Run render CPU tests
        timeout-minutes: 10
        shell: bash
        run: |
          cargo test -p zero-render-foundation --lib cpu:: --target ${{ matrix.target }} -- --test-threads=1

      - name: Note unsupported V8 runtime tests
        if: matrix.v8_runtime == false
        run: |
          echo "Skipping V8-backed tests for ${{ matrix.target }} (using QuickJS runtime instead)."

      - name: Run QuickJS-backed tests
        if: matrix.v8_runtime == false
        timeout-minutes: 20
        shell: bash
        run: |
          cargo test ${{ matrix.features }} \
            -p zero-script-sandbox \
            -p zero-webview \
            -p zero-browser \
            -p zero-renderer \
            -p zero-webview-demo \
            -p zero-integration-tests \
            -p zero-wpt-runner \
            --target ${{ matrix.target }} -- --test-threads=1

      - name: Build release
        if: matrix.release_build != false && github.event_name == 'workflow_dispatch' && inputs.run_release_builds == true
        timeout-minutes: 20
        run: cargo build ${{ matrix.features }} --release --workspace --target ${{ matrix.target }}

      - name: Note unsupported release build
        if: matrix.release_build == false && github.event_name == 'workflow_dispatch' && inputs.run_release_builds == true
        run: |
          echo "Skipping release build for ${{ matrix.target }} (QuickJS runtime build, V8 release builds use v8_runtime=true)."

  reftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"rusty_v8\"/{n;s/version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Fetch wpt-data
        run: make fetch-wpt-data

      - name: Run reftest suite (CPU rendering)
        run: cargo run --release --bin zero-wpt-runner -- reftest --format json

      - name: Upload reftest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reftest-report
          path: docs/goal/rendering-compat/evidence/
          retention-days: 3

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - name: Run benchmarks
        run: |
          chmod +x scripts/run-benchmarks.sh
          ./scripts/run-benchmarks.sh
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tests/benchmarks/results/
          retention-days: 3
