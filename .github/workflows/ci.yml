name: CI

on:
  workflow_dispatch:
    inputs:
      run_release_builds:
        description: 'Also run release builds after checks and tests'
        type: boolean
        default: false
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || (github.event.review.state == 'approved' && github.event.review.author_association == 'OWNER')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # windows-aarch64: freetype-sys 0.23.0 在 ARM64 MSVC 上 filter_neon.S 汇编
    # 文件不被 cl.exe 识别（需 armasm64.exe），为已知上游 bug，不阻塞 CI
    continue-on-error: ${{ matrix.name == 'windows-aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            v8_runtime: true
            release_build: true
            features: ''
          - name: linux-x86_64-quickjs
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            v8_runtime: false
            release_build: false
            features: '--no-default-features --features quickjs'
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            v8_runtime: true
            release_build: true
            features: ''
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            v8_runtime: true
            release_build: true
            features: ''
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            v8_runtime: true
            release_build: true
            features: ''
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            v8_runtime: true
            release_build: true
            features: ''
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            v8_runtime: false
            release_build: false
            features: '--no-default-features --features quickjs'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zero-web/rusty_v8
            ~/Library/Caches/zero-web/rusty_v8
            ~/AppData/Local/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      # cargo-nextest 测试执行器（2026-08-07 起 make test 同款）：二进制间并行 +
      # per-test 隔离（较 cargo test 的 --test-threads=1 更快更稳）。taiki-e/install-action
      # 用官方预编译二进制（~10s），比 cargo install（~2-5min/job）快。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download rusty_v8 archive
        if: runner.os != 'Windows' && matrix.v8_runtime != false
        shell: bash
        run: RUSTY_V8_TARGET=${{ matrix.target }} bash scripts/download-rusty-v8.sh

      - name: Fetch wpt-data
        # zero-wpt-runner reftest 字体测试（reftest_fonts.rs）依赖 wpt-data 真实字体；
        # 与 smoke/reftest job 一致，跑 zero-wpt-runner 前必须拉取（R3232-F/R3239-F 起）
        run: make fetch-wpt-data

      - name: Configure rusty_v8 archive on Windows
        if: runner.os == 'Windows' && matrix.v8_runtime != false
        shell: bash
        run: |
          echo "RUSTY_V8_ARCHIVE=https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/rusty_v8_release_${{ matrix.target }}.lib.gz" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=advapi32.lib" >> "$GITHUB_ENV"

      - name: Install zlib via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.target }}' -match 'aarch64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
          Write-Host "Installing zlib:$triplet via vcpkg..."
          vcpkg install zlib --triplet $triplet
          $vcpkgInclude = "C:\vcpkg\installed\$triplet\include"
          $vcpkgLib = "C:\vcpkg\installed\$triplet\lib"
          "CFLAGS=-I$vcpkgInclude" >> $env:GITHUB_ENV
          "INCLUDE=$vcpkgInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$vcpkgLib;$env:LIB" >> $env:GITHUB_ENV
          Write-Host "vcpkg zlib installed, CFLAGS/INCLUDE/LIB set to $vcpkgInclude"

      - name: Configure MSVC include paths for clang/bindgen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # clang (via bindgen) 需要 MSVC std headers (stdio.h etc)，但不会自动发现 ARM64 VS
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
          if (-not $vsPath) { $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" }
          Write-Host "VS installation: $vsPath"
          # 找最新 MSVC
          $msvcVer = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $sdkVer = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($msvcVer -and $sdkVer) {
            $msvcInc = "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\include"
            $sdkUcrt = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\ucrt"
            $sdkUm = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\um"
            $sdkShared = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$($sdkVer.Name)\shared"
            $clangArgs = "-isystem`"$msvcInc`" -isystem`"$sdkUcrt`" -isystem`"$sdkUm`" -isystem`"$sdkShared`""
            "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs" >> $env:GITHUB_ENV
            Write-Host "BINDGEN_EXTRA_CLANG_ARGS=$clangArgs"
          } else {
            Write-Host "WARNING: could not locate MSVC/SDK include paths"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace (V8-free targets only; V8 targets are fully checked by clippy)
        if: matrix.v8_runtime == false && matrix.name != 'windows-aarch64'
        run: cargo check ${{ matrix.features }} --workspace --target ${{ matrix.target }}

      - name: Patch freetype-sys filter_neon.S for MSVC (windows-aarch64)
        if: matrix.name == 'windows-aarch64'
        shell: bash
        run: |
          # filer_neon.S 是 ARM NEON 手写汇编，MSVC cl.exe 无法编译 .S 文件。
          # 同目录的 filter_neon_intrinsics.c 提供等价 C intrinsics 实现。
          # 将 .S 替换为空文件，让链接通过，功能由 .c 版本提供。
          set -e
          cargo fetch --target ${{ matrix.target }}
          CRATE_FILE=$(find "$CARGO_HOME/registry/cache" -name "freetype-sys-0.23.0.crate" 2>/dev/null | head -1)
          if [ -z "$CRATE_FILE" ]; then
            echo "ERROR: freetype-sys-0.23.0.crate not found in cache"
            exit 1
          fi
          echo "Patching $CRATE_FILE: removing filter_neon.S from build.rs"
          MSYS2_CRATE=$(cygpath -u "$CRATE_FILE")
          TMPDIR=$(mktemp -d)
          tar xzf "$MSYS2_CRATE" -C "$TMPDIR"
          find "$TMPDIR" -name "build.rs" -exec sed -i '/filter_neon\.S/d' {} \;
          (cd "$TMPDIR/freetype-sys-0.23.0" && rm -f .cargo-checksum.json && find . -type f -exec sha256sum {} \; | sort -k 2 > .cargo-checksum.json)
          tar czf "$MSYS2_CRATE" -C "$TMPDIR" freetype-sys-0.23.0
          rm -rf "$TMPDIR"
          rm -rf $(find "$CARGO_HOME/registry/src" -name "freetype-sys-0.23.0" -type d 2>/dev/null)
          echo "Patch applied."

      - name: Check workspace (V8-free targets only; V8 targets are fully checked by clippy)
        if: matrix.v8_runtime == false && matrix.name != 'windows-aarch64'
        run: cargo check ${{ matrix.features }} --workspace --target ${{ matrix.target }}

      - name: Check workspace (windows-aarch64 — known freetype-sys NEON issue)
        if: matrix.name == 'windows-aarch64'
        continue-on-error: true
        run: cargo check ${{ matrix.features }} --workspace --target ${{ matrix.target }}

      - name: Run clippy
        if: matrix.v8_runtime != false
        run: cargo clippy ${{ matrix.features }} --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run clippy without V8-backed targets
        if: matrix.v8_runtime == false
        shell: bash
        run: |
          cargo clippy ${{ matrix.features }} \
            -p zero-dom \
            -p zero-css-parser \
            -p zero-style-system \
            -p zero-layout-engine \
            -p zero-engine \
            -p zero-canvas \
            -p zero-host-runtime \
            -p zero-net \
            -p zero-security \
            -p zero-storage \
            -p zero-protocol \
            -p zero-wasm-sandbox \
            -p zero-page-runtime \
            -p zero-render-foundation \
            --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run core crate tests without V8
        if: matrix.v8_runtime != false
        timeout-minutes: 20
        shell: bash
        run: |
          cargo nextest run ${{ matrix.features }} \
            -p zero-dom \
            -p zero-css-parser \
            -p zero-style-system \
            -p zero-layout-engine \
            -p zero-engine \
            -p zero-canvas \
            -p zero-host-runtime \
            -p zero-net \
            -p zero-security \
            -p zero-storage \
            -p zero-protocol \
            -p zero-wasm-sandbox \
            -p zero-page-runtime \
            --target ${{ matrix.target }}

      - name: Run V8-backed core tests
        if: matrix.v8_runtime != false && runner.os != 'Windows'
        timeout-minutes: 20
        shell: bash
        run: |
          cargo nextest run ${{ matrix.features }} \
            -p zero-script-sandbox \
            -p zero-webview \
            --target ${{ matrix.target }}

      - name: Build zero-compositor (bin required by browser compositor tests)
        shell: bash
        run: |
          # 不带 --target/--features：browser 测试 fallback 路径硬编码
          # target/debug/zero-compositor；compositor 无 features 定义
          cargo build -p zero-compositor --bin zero-compositor

      - name: Run app tests
        if: matrix.v8_runtime != false
        timeout-minutes: 40
        shell: bash
        run: |
          cargo nextest run ${{ matrix.features }} \
            -p zero-browser \
            -p zero-renderer \
            -p zero-webview-demo \
            --target ${{ matrix.target }}

      # Browser tests otherwise may start a stale child executable from target/debug.
      # This explicit Windows gate builds the renderer first, then verifies physical
      # clicks, both text controls, button actions, scale factors, and Chinese IME.
      - name: Run real form interaction GUI gate (Windows x86_64)
        if: matrix.name == 'windows-x86_64'
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/test-form-interaction.ps1

      - name: Run integration and WPT runner tests
        if: matrix.v8_runtime != false
        timeout-minutes: 20
        shell: bash
        run: |
          RUST_BACKTRACE=1 cargo nextest run ${{ matrix.features }} \
            -p zero-integration-tests \
            -p zero-wpt-runner \
            --target ${{ matrix.target }}

      - name: Run render CPU tests
        timeout-minutes: 10
        shell: bash
        run: |
          # Strip "--features quickjs": zero-render-foundation 没有 quickjs feature，
          # QuickJS 构建只需 --no-default-features 跳过 freetype-raster
          RENDER_FEATURES="${{ matrix.features }}"
          RENDER_FEATURES="${RENDER_FEATURES//--features quickjs/}"
          cargo nextest run $RENDER_FEATURES -p zero-render-foundation --lib cpu:: --target ${{ matrix.target }}

      - name: Note unsupported V8 runtime tests
        if: matrix.v8_runtime == false
        run: |
          echo "Skipping V8-backed tests for ${{ matrix.target }} (using QuickJS runtime instead)."

      - name: Build zero-compositor (bin required by browser compositor tests)
        if: matrix.v8_runtime == false
        shell: bash
        run: |
          # 不带 --target/--features：browser 测试 fallback 路径硬编码
          # target/debug/zero-compositor；compositor 无 features 定义
          cargo build -p zero-compositor --bin zero-compositor

      - name: Run QuickJS-backed tests
        if: matrix.v8_runtime == false
        timeout-minutes: 20
        shell: bash
        run: |
          cargo nextest run ${{ matrix.features }} \
            -p zero-script-sandbox \
            -p zero-webview \
            -p zero-browser \
            -p zero-renderer \
            -p zero-webview-demo \
            -p zero-integration-tests \
            -p zero-wpt-runner \
            --target ${{ matrix.target }}

      - name: Build release
        if: matrix.release_build != false && github.event_name == 'workflow_dispatch' && inputs.run_release_builds == true
        timeout-minutes: 20
        run: cargo build ${{ matrix.features }} --release --workspace --target ${{ matrix.target }}

      - name: Note unsupported release build
        if: matrix.release_build == false && github.event_name == 'workflow_dispatch' && inputs.run_release_builds == true
        run: |
          echo "Skipping release build for ${{ matrix.target }} (QuickJS runtime build, V8 release builds use v8_runtime=true)."

  # B2 分层门禁（A2 闭环）：smoke job 秒级，PR 审阅通过（OWNER approved）
  # 即触发——reftest-smoke.txt 清单（33 条跨领域代表性 case）必须全过。
  # 全量 reftest 留 workflow_dispatch（慢，见下）。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || (github.event.review.state == 'approved' && github.event.review.author_association == 'OWNER')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Fetch wpt-data
        run: make fetch-wpt-data

      - name: Build zero-wpt-runner (release)
        run: cargo build --release --bin zero-wpt-runner

      - name: Run reftest smoke gate (must pass)
        run: bash scripts/run-reftest-smoke.sh

      # A3 flaky 门禁：wpt-runner 测试重跑 3 轮（test-threads=1），
      # 任一失败即判 flaky——CI 上不稳定的测试不能带 flaky 合入。
      - name: Flakiness check (3 rounds, must be stable)
        run: bash scripts/check-test-flakiness.sh zero-wpt-runner

  reftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine rusty_v8 version
        shell: bash
        run: |
          echo "RUSTY_V8_VERSION=$(sed -n '/name = \"v8\"/{n;s/^version = \"//;s/\"$//;p;q;}' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Cache rusty_v8
        uses: actions/cache@v6
        with:
          path: ~/.cache/zero-web/rusty_v8
          key: rusty_v8-${{ env.RUSTY_V8_VERSION }}-x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download rusty_v8 archive
        shell: bash
        run: bash scripts/download-rusty-v8.sh

      - name: Fetch wpt-data
        run: make fetch-wpt-data

      - name: Run reftest suite (CPU rendering)
        run: cargo run --release --bin zero-wpt-runner -- reftest --format json

      - name: Upload reftest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reftest-report
          path: docs/goal/rendering-compat/evidence/
          retention-days: 3

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # job-level contents: write —— 提交 perf 基线/趋势回 main（与 weekly.yml benchmark-trend
    # 一致；本 job 仅 workflow_dispatch 触发，不暴露 PR 路径；2026-08-10 用户批准）
    permissions:
      contents: write
    # 2026-08-08：解除对 build-and-test 的依赖——quickjs 矩阵的 tab_js_worker 失败
    #（对方流 P1a 在 QuickJS 运行时的兼容问题，136/225 测试）不应阻塞 v8 基线的建立；
    # 本 job 自己完整构建 v8（bench-report 编译 bench + zero-wpt-runner）。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers

      - name: Setup rusty_v8
        run: |
          bash scripts/download-rusty-v8.sh

      # 性能门禁（docs/specs/performance-and-resource-budget.md）：真实测量 + 门禁比较。
      # 基线 = docs/perf/baselines/github-ubuntu-latest.json（GITHUB_ACTIONS 环境自动选择）。
      # 首次运行（无基线）→ PASS+WARN 附 capture 指引；此后每周 benchmark-trend（weekly.yml）
      # 在同一 runner 类上执行真门禁并 auto-tighten。PR 不动（runner 硬件噪声，见 policy 文档）。
      - name: Run benchmarks and gate
        run: |
          bash scripts/bench-report.sh
          bash scripts/perf-gate.sh

      # 基线闭环（2026-08-08）：auto-tighten 首次运行自动建立 github-ubuntu-latest
      # 基线（record-bench-trend.sh 无基线时委托 record-bench-baseline.sh），
      # 后续 dispatch 自动收紧。CI workspace 是临时的——须提交回 main 持久化。
      - name: Record benchmark trend (auto-create baseline on first run)
        run: bash scripts/record-bench-trend.sh --auto-tighten

      - name: Commit perf baseline/trend back to main
        if: always()
        run: |
          git config user.name "zero-web-bot"
          git config user.email "zero-web-bot@users.noreply.github.com"
          git add docs/perf/
          if git diff --cached --quiet; then
            echo "No perf baseline changes."
          else
            git commit -m "chore(perf): 更新 CI 性能基线/趋势（benchmarks dispatch）"
            # 冲突容忍：基线/趋势为追加式数据，冲突时取远端（权威版本）；
            # 本地本次测量经下一轮 auto-tighten 继续收敛
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Perf baseline committed and pushed."
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tests/benchmarks/results/
          retention-days: 14

      - name: Upload perf docs
        uses: actions/upload-artifact@v4
        with:
          name: perf-docs
          path: docs/perf/
          retention-days: 14
