name: Android Emulator Smoke

# Android 模拟器冒烟（android-browser goal M3，2026-09-12）：
# GitHub ubuntu runner 具备嵌套虚拟化（/dev/kvm），无需本机 KVM 授权即可执行
# chrome 级冒烟——四进程拓扑 + UID 隔离 + decoder/compositor socket probe
# （scripts/android/install-smoke.sh，emulator flavor 默认 feature，零 V8 依赖）。
# 页面级冒烟（renderer APK，V8 x86_64 交叉编译）不在本 job 范围，仍归真机路径。
# 门控与 ci.yml android job 一致：workflow_dispatch 或 OWNER 批准的 PR review。
# runner 无 /dev/kvm 时本 job 直接失败——以运行日志为据回落「等 KVM/设备」，不静默绿。
on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # avdmanager（新 cmdline-tools 走 ANDROID_USER_HOME）与 emulator 37.x（走
  # ANDROID_AVD_HOME → ANDROID_SDK_HOME/avd → HOME/.android/avd）的默认 AVD 目录
  # 在 runner 上不一致，实证 run 34703425006/34704966636：emulator 报
  # Unknown AVD name 即刻退出。显式钉死同一目录给两个工具。
  ANDROID_AVD_HOME: ${{ github.workspace }}/avd-home

jobs:
  emulator-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.review.state == 'approved' && github.event.review.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android-browser/gradle/libs.versions.toml', 'apps/android-browser/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            android-cargo-
            ${{ runner.os }}-cargo-

      - name: Check KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::runner exposes no /dev/kvm — emulator smoke cannot run on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Build emulator debug APK (x86_64 native via gradle buildRustNative)
        working-directory: apps/android-browser
        run: ./gradlew --no-daemon :app:assembleEmulatorDebug

      # API 35 google_apis：CI 实证最稳的平衡档（API 36 首轮实证 300s 内 adb 不上线，见
      # run 34703425006）；无此包则回落 API 34。镜像缺包失败立即回落，镜像在但 boot 慢由
      # 后续 boot 步骤暴露。
      - name: Install emulator and system image
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          IMG="system-images;android-35;google_apis;x86_64"
          yes | "$SDKM" --install "emulator" "$IMG" > sdkmanager-install.log 2>&1 \
            || { IMG="system-images;android-34;google_apis;x86_64"; yes | "$SDKM" --install "emulator" "$IMG" > sdkmanager-install.log 2>&1; }
          tail -5 sdkmanager-install.log
          echo "SMOKE_IMAGE=$IMG" >> "$GITHUB_ENV"

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n zeroweb-smoke -k "$SMOKE_IMAGE" -d pixel
          ls -la "$ANDROID_AVD_HOME"
          # 用 emulator 自己的发现路径预检，防「创建在 A、启动找 B」的静默错位
          listed=$("$ANDROID_HOME/emulator/emulator" -list-avds)
          echo "emulator-visible AVDs: $listed"
          grep -qx zeroweb-smoke <<<"$listed" || {
            echo "::error::emulator cannot discover AVD zeroweb-smoke (searches \$ANDROID_AVD_HOME/\$ANDROID_SDK_HOME/avd/\$HOME/.android/avd)"
            exit 1
          }

      # adb server 先起：emulator 启动期注册到已存在的 server，避免晚起 server 的注册竞态。
      # -cores 4 + -memory 4096 压首启 dexopt 时长；-no-metrics 防 CI 上的遥测卡顿。
      - name: Boot emulator (headless, swiftshader)
        run: |
          "$ANDROID_HOME/platform-tools/adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd zeroweb-smoke \
            -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim \
            -no-snapshot -no-metrics -camera-back none -camera-front none \
            -cores 4 -memory 4096 \
            > emulator-boot.log 2>&1 &

      - name: Wait for boot completion
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 600 "$ADB" wait-for-device || true
          "$ADB" devices -l || true
          boot=""
          for i in $(seq 1 120); do
            boot=$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            sleep 5
          done
          if [ "$boot" != "1" ]; then
            echo "::error::emulator boot timed out"
            pgrep -af qemu || pgrep -af emulator || true
            ls -la "$ANDROID_AVD_HOME" || true
            "$ADB" devices -l || true
            tail -50 emulator-boot.log || true
            exit 1
          fi
          api=$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')
          abi=$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')
          echo "emulator boot completed (api $api, abi $abi)"

      # install-smoke.sh 自带 wait-for-device / install / am start / 拓扑与 probe 断言。
      # 慢启动兜底重试一次：force-stop 后整树重启，probe 日志会在脚本清空 logcat 后
      # 重新产生（断言不放宽——重试后仍须全项通过）。
      - name: Run install smoke (topology / UID isolation / probe assertions)
        run: |
          APK=apps/android-browser/app/build/outputs/apk/emulator/debug/app-emulator-debug.apk
          ADB="$ANDROID_HOME/platform-tools/adb"
          if ! bash scripts/android/install-smoke.sh "$APK"; then
            echo "::warning::smoke attempt 1 failed; retrying once after force-stop"
            "$ADB" shell am force-stop com.leizm.zeroweb || true
            sleep 10
            bash scripts/android/install-smoke.sh "$APK"
          fi

      # M5 chaos：角色进程 kill → 断连恢复重绑（RFC M3 death recovery 语义执行验证）。
      # 脚本内自取 adb root（google_apis 非 playstore 镜像支持）。
      - name: Run chaos smoke (role kill → rebind recovery)
        run: bash scripts/android/chaos-smoke.sh

      - name: Collect smoke diagnostics
        if: failure()
        run: |
          mkdir -p smoke-logs
          ADB="$ANDROID_HOME/platform-tools/adb"
          # adb 对 offline 设备可能无限等待，一律 timeout 包裹防 hang（首轮实证）
          timeout 60 "$ADB" devices -l > smoke-logs/adb-devices.txt 2>&1 || true
          timeout 90 "$ADB" logcat -d > smoke-logs/logcat.txt 2>&1 || true
          timeout 60 "$ADB" shell ps -A -o USER,NAME > smoke-logs/ps.txt 2>&1 || true
          pgrep -af qemu > smoke-logs/emulator-process.txt 2>&1 || true
          ls -la "$ANDROID_AVD_HOME" > smoke-logs/avd-home.txt 2>&1 || true
          cp emulator-boot.log sdkmanager-install.log smoke-logs/ 2>/dev/null || true

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-diagnostics
          path: smoke-logs/
          retention-days: 14
