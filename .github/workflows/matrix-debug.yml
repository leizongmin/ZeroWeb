name: Matrix Debug
on:
  workflow_dispatch:
    inputs:
      run_matrix:
        description: 'expand matrix'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  discover-shards:
    if: github.event_name == 'workflow_dispatch' && inputs.run_matrix
    runs-on: ubuntu-latest
    outputs:
      shards_json: ${{ steps.discover.outputs.shards_json }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          python3 tests/wpt-runner/scripts/ci_discover_shards.py \
            --runner-src tests/wpt-runner/src/main.rs \
            --tuned tests/wpt-runner/ci-shards.yml \
            --registry tests/wpt-runner/ci-catchall.tsv \
            --out-shards /tmp/shards.json
          echo "shards_json=$(cat /tmp/shards.json)" >> "$GITHUB_OUTPUT"
  fanout:
    if: github.event_name == 'workflow_dispatch' && inputs.run_matrix
    needs: discover-shards
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard.job_timeout || 150 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs['discover-shards'].outputs.shards_json) }}
    steps:
      - run: echo "shard=${{ matrix.shard.name }}"
