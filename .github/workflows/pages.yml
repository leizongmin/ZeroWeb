name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/generate-website-metrics.py'
      - 'scripts/generate-website.py'
      - 'scripts/website-render.mjs'
      - 'scripts/test-website-seo.py'
      - 'scripts/test-website-layout.mjs'
      - 'scripts/test-guard.rs'
      - 'docs/perf/trends/benchmark-trend.csv'
      - 'docs/goal/rendering-compat/evidence/wpt-trends/trend.csv'
      - 'docs/compat/trends/wpt-suites.csv'
      - 'docs/compat/wptfyi/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # weekly 完成即重部署：coverage/gap 快照由 weekly 的 GITHUB_TOKEN 回写
  # main，而 GITHUB_TOKEN 产生的 push 不触发 push 事件级联（GitHub 防递归），
  # 仅靠上面 docs/compat/wptfyi/** 路径过滤从未在 CI 回写后生效（2026-11-02
  # 实证：66.96% 快照 d2ea12b 未部署，站点停在 42.11% 旧快照）。workflow_run
  # 不受该限制，weekly 无论哪个 job 回写快照，完成后都补一次部署（幂等）。
  workflow_run:
    workflows: ["Weekly Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare resource guard
        run: |
          ulimit -v 8388608
          timeout 60 rustc --edition 2024 scripts/test-guard.rs -o "$RUNNER_TEMP/website-guard"
      - name: Generate static website
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          "$RUNNER_TEMP/website-guard" --per-proc-mem 1 --total-mem 2 --time-limit 120 -- python scripts/generate-website.py --output "$RUNNER_TEMP/zeroweb-site"
      - name: Validate SEO and internal links
        run: |
          "$RUNNER_TEMP/website-guard" --per-proc-mem 1 --total-mem 2 --time-limit 120 -- python scripts/test-website-seo.py "$RUNNER_TEMP/zeroweb-site"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/zeroweb-site
      - id: deployment
        uses: actions/deploy-pages@v5
